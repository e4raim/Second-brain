водством и вернусь».\n- Встречу можно записать на диктофон и разобрать с наставником.\n- Перед продажей обязательно зафиксировать: комиссию, условия продажи, мотивацию.\n\n## После встречи\n1. Загрузи объект в CRM, он автоматически выгрузится на площадки.\n2. Доступ к рабочему аккаунту ЦИАНа выдаёт компания.\n3. Напиши описание, добавь фото, подключи продвижение.\n4. Звони собственнику минимум раз в неделю, даже если он ещё не разрешил рекламу.\n\n**Вопросы себе после встречи (Димитриадис):** Человек действительно хотел продавать? Был готов принимать решение сейчас? Были ли у меня все ответы ещё до встречи? Если важный вопрос задан после встречи, он задан слишком поздно. Самая дорогая встреча та, что не закончилась договором. Занятость и продуктивность — разные вещи.\n\n**Если клиент берёт паузу:** зафиксируй причину паузы, предполагаемый срок и дату следующего контакта.\n\n## Связанные темы\n- [Три договорённости](#tri-dogovorennosti)\n- [Цена и снижение](#cena-i-snizhenie)\n- [Работа на перспективу](#rabota-na-perspektivu)", "q": ["Зачем вообще ехать на встречу, если собственник ничего не подписал?", "Как подготовиться к встрече?", "О чём говорить на встрече?", "Что делать после встречи?", "Какие вопросы задать себе после встречи?"]}, "obekt-v-praise": {"t": "Новый объект в прайсе: реклама, комментарий, связь с собственником, жёлтая и красная зоны", "n": "Новый объект в прайсе", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Что делать сразу после того, как объект взят в работу?\n- Что писать в первом комментарии к объекту?\n- Как часто звонить собственнику?\n- Что такое «жёлтая» и «красная» зона?\n- Как переводить объект в эксклюзив и когда снижать цену?\n\n**Коротко (регламент компании):** цель этапа — монополия в ЖК и чтобы весь рынок узнал об объекте. ЦКП — покупатель. Объект рекламируется на всех площадках без исключений, иначе работать по нему нет смысла. Клиент видит работу агента только в звонках, поэтому звони регулярно и вовремя.\n\n## Сразу после выставления (CRM)\nОбъявление формируется в CRM и уходит в экспорт на все площадки автоматически. Выставлять новые объекты — после 20:00. **Ни один объект нельзя выкладывать в рекламу без согласия собственника.**\n\n**Первый комментарий в карточке объекта:**\n- эксклюзив или неэксклюзив;\n- какая комиссия;\n- мотивация клиента;\n- ситуация по документам;\n- реальная цена сделки;\n- дальнейшие действия со сроками.\n\nКаждую неделю обновляй последний пункт: что сделать, чтобы получить больше покупателей и продать.\n\n## Первые дни\n- **В первые 3 дня** предложи объект всем покупателям, которые обращались с похожим запросом и сейчас в поиске (сортировка в CRM).\n- Каждый день проверяй объявления на ошибки и корректность экспорта.\n- Следи за положением на площадках. Реклама неэксклюзивного объекта всегда должна стоять выше рекламы агента-конкурента.\n- **Переуступка:** запроси у дольщика ДДУ для техподдержки площадок (через ресепшн центрального офиса) и отправь объект в Telegram-чат «Переуступки».\n- **Коммерция или 1–2 этаж:** можно повесить баннер.\n- Если сделал объект впервые для стажёра: первичный анализ рынка для собственника (PDF с ценами конкурентов и рекомендацией по цене).\n\n## Связь с собственником\n1. Сразу после выставления: «Запустили поиск покупателей».\n2. Через 3–4 дня: отчёт — что сделано, кому предложили, какая обратная связь.\n3. До и после каждого показа.\n4. Дальше не реже раза в неделю.\n\n## Жёлтая и красная зона\n- **Жёлтая зона:** последний контакт с клиентом был больше 7 дней назад. Сигнал, что объект не востребован или покупатели до нас не доходят. Пора действовать: перевести в эксклюзив, скорректировать цену.\n- **Красная зона:** контакта не было больше 14 дней. Объект убирается из экспорта, у агента есть 24 часа на исправление, иначе объект могут передать другому сотруднику.\n- Жёлтую зону прайса обзваниваешь каждый день (≈40 минут в распорядке дня).\n\n## Действия с объектом\n- **Перевод в эксклюзив:** убираем объявление собственника и других агентов.\n- **Корректировка цены:** повторный анализ рынка и конкурентов, сопроводительный звонок собственнику. ⚠️ Снижая цену неэксклюзивного объекта, рискуешь подарить сделку агенту-конкуренту. **Сначала переводим в эксклюзив, потом корректируем цену.**\n- Выход в рынок по правильной цене важнее любых последующих действий (см. [Цена и снижение](#cena-i-snizhenie)).\n\n## Связанные темы\n- [Работа на перспективу и удержание](#rabota-na-perspektivu)\n- [Покупатели и показ](#pokupateli-i-pokaz)", "q": ["Что делать сразу после того, как объект взят в работу?", "Что писать в первом комментарии к объекту?", "Как часто звонить собственнику?", "Что такое «жёлтая» и «красная» зона?", "Как переводить объект в эксклюзив и когда снижать цену?"]}, "podgotovka-obekta-k-pokazu": {"t": "Подготовка объекта к показу и мотивация собственника", "n": "Подготовка объекта к показу и мотивация собственника", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Как подготовить квартиру к показу?\n- Что такое хоумстейджинг?\n- Почему собственнику лучше не присутствовать на показе?\n- Можно ли продавать квартиру, в которой живёт арендатор?\n- Как понять, что собственник на самом деле не мотивирован продавать?\n- Какие документы собственник должен собрать заранее?\n\n**Коротко (из внешнего источника: видео А. Аверьянова):** каждый устранимый дефект становится поводом для торга, причём на сумму больше, чем стоит ремонт. Объект должен быть чистым, с мебелью, без следов хозяев, доступным для показа почти в любое время и без собственника на показе.\n\n## Чек-лист перед показами\n- [ ] Устранить мелкие дефекты: перегоревшие лампочки, трещины, которые можно закрасить\n- [ ] Клининг и порядок\n- [ ] Минимум личных вещей. Убрать религиозные символы, охотничьи трофеи, всё интимное\n- [ ] Животные и домочадцы на время показа уходят\n- [ ] Комфортная температура, приятный запах, вода в холодильнике, работающая кофемашина, готовый гостевой санузел\n- [ ] Мебель не вывозить: если на фото квартира с мебелью, а на показе пустая коробка, ожидания покупателя не оправдываются\n- [ ] Хоумстейджинг, если есть возможность: несколько сотен тысяч рублей вложений могут дать миллионы\n- [ ] Доступ к показам: ключи, письменное согласие для ресепшена, пропуск на территорию\n- [ ] Документы и паспорт объекта: архитектурный и дизайн-проект, инженерия, гарантийные талоны, марки материалов и техники, контакты обслуживающих организаций\n\n**Если собственник живёт в квартире:** договориться о «режиме показа», когда всё убрано и дома никого нет.\n\n## Собственник на показе\nЛучше без него. Покупатель сразу начинает торговаться и выяснять «подводные камни», ломает сценарий презентации. Из вежливости он не скажет, что ему не понравилось, и собственник не узнает, почему квартиру не покупают. Если собственник раздаёт покупателям свои контакты, это красный флаг: высок риск сделки в обход агента.\n\n## Арендатор в продаваемой квартире\nАрендатор не заинтересован в продаже: его выселят. Он мешает показам и не соблюдает режим показа. По опыту автора видео, такие объекты продаются плохо или с большим дисконтом.\n\n📌 **Наша практика:** лучше, чтобы арендаторов в продаваемой квартире не было: они не хотят съезжать и не заинтересованы в продаже. При этом можно параллельно искать и покупателя, и арендатора, если собственник ещё не решил, продавать или сдавать.\n\n## Признаки немотивированного продавца\nЗавышенная цена. Не готов к клинингу, мелкому ремонту, хоумстейджингу. Нет гибкого доступа к показам («во вторник с 8 до 9»). Не выселяет арендатора. Хочет закрытую продажу: без фото или без публичной рекламы. Брокеры охотнее работают с мотивированными собственниками. Если ты мотивирован, покажи это открыто.\n\n## Срыв сделки по вине собственника\n- Нашёлся покупатель на его цену, собственнику показалось, что продешевил, и он поднимает цену. Первое предложение часто самое выгодное.\n- Просит огромный задаток под свои финансовые задачи. Покупатель чувствует неладное.\n- Подключает «семейного» юриста без опыта сделок с недвижимостью.\n- Отказывает покупателю дома в строительной экспертизе.\n- Не даёт полный пакет документов для проверки.\n- Не платит комиссию вовремя или снижает её в процессе. Рынок элитки узкий, у агентств есть чёрные списки.\n\n## Ликвидность\nО ликвидности думают при покупке, а не при продаже. Морально устаревшие объекты, индивидуальные «хотелки», несоответствие продукта локации требуют больших дисконтов.\n\n## Связанные темы\n- [Цена и снижение](#cena-i-snizhenie)\n- [Юридическая база: готовность до выхода на рынок](#yuridicheskaya-baza)\n- [Встреча с собственником](#vstrecha-s-sobstvennikom)", "q": ["Как подготовить квартиру к показу?", "Что такое хоумстейджинг?", "Почему собственнику лучше не присутствовать на показе?", "Можно ли продавать квартиру, в которой живёт арендатор?", "Как понять, что собственник на самом деле не мотивирован продавать?", "Какие документы собственник должен собрать заранее?"]}, "pokupateli-i-pokaz": {"t": "Покупатели и показ: квалификация, диалог, показ, переговоры", "n": "Покупатели и показ", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Что делать, когда звонит покупатель по объявлению?\n- Какие вопросы задать покупателю?\n- Где ещё брать покупателей?\n- Как можно проводить показы?\n- Зачем нужен показ, кроме продажи этой квартиры?\n\n**Коротко (регламент компании):** каждый покупатель, который позвонил, фиксируется в CRM: карточка, теги, подробный комментарий и прикреплённый объект. Перед показом покупателя квалифицируем. На показе должны быть все, кто принимает решение о покупке.\n\n## Предквалификация покупателя\n1. Для себя или для кого-то?\n2. Ипотека или наличные?\n3. Если ипотека: одобрена ли, в каком банке, какая сумма?\n4. Что ещё смотрели или планируют посмотреть?\n5. Знакомы ли с комплексом?\n6. Если квартира подходит — на показе будут все, кто принимает решение?\n\n## Пример диалога\n**Покупатель:** Здравствуйте, звоню по объявлению о продаже квартиры по адресу… Продаёте?\n**Агент:** Да, продаём. Вы себе хотите купить?\n**Покупатель:** Да, себе.\n**Агент:** Замечательно. Кстати, меня зовут …, а вас как? … Очень приятно. Вы ищете только 1 (2, 3)-комнатные?\n**Агент:** Рассматриваете квартиры с ремонтом или без?\n**Агент:** Вам нужно купить именно в этом районе или ЖК?\n**Агент:** Для покупки будете использовать наличные или ипотеку? … Одобрение уже есть? В каком банке?\n**Агент:** Как скоро вам нужно купить?\n**Агент:** Какие квартиры с похожими параметрами уже смотрели?\n\n## Откуда берутся покупатели\n- Реклама на всех площадках.\n- Покупатели коллег и контрагентов (партнёрские сделки).\n- Покупатели от отдела новостроек.\n- Сфера влияния: бывшие клиенты, собственники-альтернативщики (свои и коллег).\n- Бывшие арендаторы.\n- Тег «Покупатель» по своему ЖК: в CRM сортировка «ЖК + Покупатель» (галочка «Теги вместе») — прозвонить всех, кто когда-либо обращался.\n\nПокупателя с запросом не по твоему профилю передаёшь по регламенту: другому агенту, в отдел новостроек или в офис в Дубае, комиссию делите.\n\n## Показ\nБез показа готовое жильё почти не продаётся. Показ даёт:\n- реальную потребность покупателя;\n- лояльность собственника;\n- обратную связь рынка по цене;\n- лояльность покупателя, даже если эта квартира не подойдёт. Покупатель и арендатор с показа могут стать твоими клиентами;\n- предложение по цене.\n\n**Как проводить показы:**\n- с собственником: он приезжает и открывает. Заранее согласуй удобные дни;\n- собственник передаёт ключи, и ты показываешь сам. При необходимости можно дать собственнику информационное письмо за подписью руководителя;\n- приезжает доверенное лицо собственника с ключами (родственник, водитель).\n\nОбратная связь собственнику — до и после показа. Покупателю — сразу после показа и через какое-то время. Каждый показ прикрепляется в CRM с комментарием.\n\n**Переговоры:** торг и согласование цены между покупателем и собственником. Договорились о цене и схеме — фиксируем задатком (см. [Юридическая база](#yuridicheskaya-baza)).\n\n## Связанные темы\n- [Подготовка объекта к показу](#podgotovka-obekta-k-pokazu)\n- [Путь сделки](#put-sdelki)", "q": ["Что делать, когда звонит покупатель по объявлению?", "Какие вопросы задать покупателю?", "Где ещё брать покупателей?", "Как можно проводить показы?", "Зачем нужен показ, кроме продажи этой квартиры?"]}, "cena-i-snizhenie": {"t": "Цена: переоценённый объект и как снижать", "n": "Цена", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Что делать, если собственник хочет цену выше рынка?\n- Почему переоценённая квартира вредит самой себе?\n- Как правильно снижать цену?\n- Почему нельзя выходить на рынок с завышенной ценой?\n- Какие вопросы задать собственнику, чтобы он сам увидел проблему с ценой?\n\n**Коротко:** переоценённая квартира работает на конкурентов. Покупатель приходит не влюбляться, а сбивать цену, а агенты показывают её, чтобы продать соседнюю, которая дешевле. Снижать нужно один раз и ощутимо, а не по 200 тысяч каждую неделю.\n\n## Почему переоценка вредит\n- Большинство покупателей списывают такого собственника как немотивированного.\n- Агенты, которые показывают переоценённые квартиры, говорят клиенту: «Понравилась эта? Влюбитесь в такую же за углом, только дешевле». Квартира становится фоном для чужой продажи.\n- Люди видят 25, остальные стоят 24. Покупатель придёт не влюбляться, а торговаться.\n- Первое предложение всегда лучшее. Первые 3–4 дня решают, пошёл спрос или нет.\n- Лучше отказаться от 10 предложений подряд, чем долго стоять без единого предложения, по которому можно вести переговоры.\n\n## Цепочка вопросов для переоценённого собственника (Димитриадис)\n1. Почему вы считаете, что ваша квартира стоит на 1 млн дороже?\n2. Если покупатель решит переделать ваш ремонт, какова ценность того, что вы вложили?\n3. Вы делали ремонт для себя или для следующего покупателя? А если бы покупали сами, делали бы для себя?\n4. Две одинаковые квартиры, одна за 24, другая за 23. Какую выберете?\n5. Не думаете, что остальные покупатели думают так же?\n6. Поэтому рекомендую цену 22 млн. Готовы подписать договор сегодня?\n\n## Цена при первом звонке (практика наставника)\n- «Как вы определили цену? По объявлениям ЦИАНа? То есть по квартирам, которые до сих пор не проданы? Цены реальных сделок отличаются».\n- «Почему именно эта сумма? Она нужна на покупку взамен? Как мы отстоим цену перед покупателем, если не знаем, почему она такая?»\n- «Что будет, если квартира простоит год? Продадите за 30, но из-за инфляции на них купите меньше».\n- «Моя задача — привести покупателя и влюбить его в вашу квартиру, как вы сами влюбились при покупке. Для него это пока метры в бетонной коробке, а для вас история».\n- Пример с iPhone: идёшь за 15-м, выходишь с 17-м, потому что вживую понравился. Покупатели так же: говорят «бюджет 30», а вживую готовы переплатить.\n\n## Как снижать цену\nСнижение должно быть **обоснованным, ощутимым и стратегическим.** Символическое снижение каждую неделю приучает покупателей ждать следующего.\n1. **Установить факт.** Сколько стоим, были ли показы, были ли предложения. «Что рынок говорит вам о вашей цене? Что покупают вместо вашей?»\n2. **«Что произойдёт через 2 месяца, если ничего не поменяем?»**\n3. **«Готовы поменять стратегию, чтобы изменить поведение покупателя?»** Дальше либо идём на сделку, либо отказываются, но в любом случае собственник видит реальную ситуацию.\n\n**Добивающие вопросы:** «Вы бы сами купили у себя квартиру за эти деньги?», «Что важнее: продать и решить вопрос или оставить квартиру?», «Вы наняли меня, чтобы я продал. Назовите 2–3 причины, почему рынок должен пойти вверх».\n\n**Фраза для переговоров:** «Давайте сделаем так, чтобы цена не мешала влюбиться в квартиру».\n\n## Ошибки ценообразования (из внешнего источника: А. Аверьянов)\n- **Выход на рынок с завышенной ценой.** Новый объект собирает «сливки», то есть отложенный спрос покупателей, которые давно на рынке и знают цены. При правильной цене бывает ажиотаж и даже игра на повышение. При завышенной эти покупатели объект не заметят, а потом их уже не вернуть.\n- **Цена по затратам.** «Сколько вложил» не равно «сколько стоит»: дизайнерские решения могут быть неинтересны рынку и устареть.\n- **Эмоциональная привязка:** «у меня лучший вид, лучшая отделка».\n- **Нет плана снижения.** Если упаковка и охват сделаны правильно, а спроса нет, причина только в цене. Заранее договорись, какими шагами и в какие сроки снижаем.\n- **«Хочу на руки 100, а комиссию добавляйте сами».** Цена должна сразу включать полноценную комиссию и торг. Сейчас рынок покупателя, торгуются все.\n- **Недостатки не учтены.** Объективные недостатки покупатель всё равно увидит. Все недостатки должны быть учтены в цене.\n- **Собственник не знает цен реальных сделок.** Цены объявлений не равны ценам сделок, это знают только профессионалы.\n\n## Контекст рынка\nЧем ниже ключевая ставка, тем выше цены. На инфляции собственники поднимают цены. В Москве спрос держится даже при высокой ставке: на депозитах лежат триллионы.\n\n## Связанные темы\n- [Возражение «снижаться не буду»](#vozrazheniya-sobstvennika)\n- [Встреча с собственником](#vstrecha-s-sobstvennikom)", "q": ["Что делать, если собственник хочет цену выше рынка?", "Почему переоценённая квартира вредит самой себе?", "Как правильно снижать цену?", "Почему нельзя выходить на рынок с завышенной ценой?", "Какие вопросы задать собственнику, чтобы он сам увидел проблему с ценой?"]}, "rabota-na-perspektivu": {"t": "Работа на перспективу: снежный ком и удержание собственника", "n": "Работа на перспективу", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Почему я звоню, а денег нет?\n- Что делать с собственником, который сказал «продаю через полгода»?\n- Почему собственники уходят к другим агентам, когда объект уже у меня?\n- Как часто звонить собственнику?\n\n**Коротко:** сегодняшний звонок почти никогда не даёт сделку сегодня. Он даёт контакт, который сработает через неделю, месяц или полгода. Мы работаем не на день, а на свою воронку. Каждое следующее касание теплее предыдущего.\n\n## Эффект снежного кома\n- «Пока не продаю» — это не отказ, а контакт на перспективу. Вносишь в CRM и ставишь дату следующего касания.\n- В следующий раз ты звонишь не незнакомцу, а человеку, который тебя помнит.\n- Через пару месяцев в базе сотни людей, которые тебя знают. Часть созреет и придёт к тебе, а не к другому агенту.\n- Закрытая сделка даёт рекомендации, соседей по ЖК и повторных клиентов.\n\n```\n1–2 неделя:  звонки → контакты в CRM → денег нет\n3–6 неделя:  повторные касания → первые объекты → показы\nдальше:      база работает сама → объекты, рекомендации, сделки\n```\n\nСроки у всех разные, схема одна. Первые недели кажется, что работаешь вхолостую, и именно здесь большинство сливается. Кто пропустил день, тот не добавил снега в свой ком.\n\n**Проверочный вопрос стажёру:** «Собственник сказал „продаю через полгода“. Что ты с ним делаешь?» Правильно: внести в CRM, касание раз в месяц-полтора, напоминать о себе пользой (цены в ЖК, новые сделки). Ответ «перезвоню через полгода» значит, что мысль не дошла.\n\n## Удержание собственника, когда объект уже у тебя\nСамая дорогая проблема — не набор объектов, а потеря собственника после того, как объект взят. Базы есть у всех, собственнику звонят другие агенты. Если ты звонишь редко, лояльность падает, и собственник, а следом и покупатели, уходят к другому агенту.\n\n- Звони минимум раз в неделю и после каждого показа, даже если сказать нечего.\n- **Каждый звонок с поводом.** Не «просто напомнить о себе», а новость: изменились цены у соседей по дому, появился покупатель под параметры, закрылась сделка в ЖК. Подготовь повод заранее, тогда звонок не откладывается.\n- CRM показывает, кому ты не позвонил. Это бесполезно, если нет дисциплины касаний.\n\n## Связанные темы\n- [Источники объектов](#istochniki-obektov)\n- [Комментарий в CRM](#kommentarii-v-crm)", "q": ["Почему я звоню, а денег нет?", "Что делать с собственником, который сказал «продаю через полгода»?", "Почему собственники уходят к другим агентам, когда объект уже у меня?", "Как часто звонить собственнику?"]}, "strategii-prodazhi-obekta": {"t": "Стратегии продажи объекта: сам, несколько агентств, эксклюзив, весь рынок, управление продажей", "n": "Стратегии продажи объекта", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Почему собственнику невыгодно продавать самому?\n- Почему «дам объект трём агентствам» работает хуже одного агента?\n- Что такое правильный эксклюзив и почему у этого слова плохая репутация?\n- Что такое «управление продажей»?\n- Зачем высокая комиссия и как она связана с партнёрами?\n- Делаем ли мы партнёрские сделки и брокер-туры?\n\n**Коротко (из внешнего источника: видео А. Аверьянова):** у собственника пять стратегий. Хуже всех — продавать самому и через несколько агентств. Лучше всех — управление продажей: одно мотивированное агентство упаковывает объект и раздаёт его всему рынку через партнёров, деля с ними комиссию. Эту логику мы используем как аргументы в разговоре с собственником.\n\n## Пять стратегий\n| Стратегия | Охват | Нервы и время собственника | Итог |\n|---|---|---|---|\n| 1. Продаёт сам | Минимальный | Максимум: фото, показы, торг сам | Худшая |\n| 2. Несколько агентств («олигополия») | До ~20% рынка даже с крупными | Много: общается со всеми | Плохая |\n| 3. «Эксклюзив, продаю только я» | Узкий | Средне | Плохая |\n| 4. Весь рынок, собственник управляет сам | Полный | Как вторая работа | Рабочая, но тяжёлая |\n| 5. Управление продажей у профессионала | Полный | Минимум | Лучшая |\n\n## Почему «сам» не работает\n- Основной трафик покупателей элитки — у агентств: их сайты, базы, лендинги. На ЦИАНе и Авито собственник теряется среди тысяч объявлений.\n- Брокер покупателя предлагает только объекты, где платят комиссию. Объект «без агентов» в подборки не попадает.\n- По объявлению «от собственника» звонят агенты и покупатели, которые хотят сэкономить и будут торговаться по максимуму.\n- Выделиться можно только суперупаковкой и платным топом (сотни тысяч рублей) или ценой ниже рынка. Это больше, чем комиссия.\n- Покупатель не скажет собственнику, что ему на самом деле не понравилось, а агенту скажет.\n- Нет доступа к профессиональным площадкам и закрытым базам агентств.\n\n## Почему «несколько агентств» не работает\n- Ни у кого нет гарантии комиссии, значит, никто не вкладывается: ни в фото, ни в описание, ни в изучение объекта.\n- Никто не зовёт партнёров: агентство заинтересовано, чтобы покупатель пришёл именно через него.\n- Один покупатель звонит в три агентства, и собственнику кажется, что покупателей много. Сделки из-за этого разваливаются.\n- Собственнику звонят всё новые агентства «у меня есть покупатель», круг расширяется, мотивация падает ещё сильнее. «У семи нянек дитя без глаза».\n\n## Почему эксклюзив дискредитирован\nЭксклюзив плохой, если:\n1. **Комиссия ниже рынка** (например, 2%). В элитном сегменте ниже 3% в городе и 4% за городом считается демпингом. Делить нечего, партнёрам неинтересно.\n2. **Агент не делится комиссией** («продаю только сам»).\n3. **Агент формально готов делиться, но ничего не делает:** нет небрендированной презентации, не разослал по профессиональным чатам, не попросил коллег разместить объект.\n\nПравильный эксклюзив = управление продажей: один ответственный, максимальная реклама и максимальное привлечение партнёров.\n\n## Управление продажей\nДве функции сделки: **организовать процесс** и **привлечь покупателя.** При управлении продажей обе берёт на себя одно агентство, это «одно окно» для собственника.\n- **Упаковка:** профессиональные фото (в том числе с коптера, днём и ночью), описание, отрисованная планировка, небрендированная PDF-презентация.\n- **Охват:** все рекламные площадки и все агентства. Объект должен быть во внутренних базах брокеров.\n- **Брокер-туры:** коллеги, которые видели объект вживую, охотнее предлагают его покупателям.\n- **Профессиональные инструменты:** чаты брокеров и закрытые профессиональные базы с условиями раздела комиссии.\n- **Партнёрские сделки:** по статистике автора, 80% сделок при управлении продажей происходят с партнёрами.\n- **Показы без собственника:** брокер с ключами проводит презентацию и присылает отчёт.\n\n**Цена услуги:** в городе от 4%, за городом 5–6%. Это не жадность: половина уходит партнёру, который привёл покупателя. За 1,5% от стандартных 3% мало кто поведёт клиента. «Высокая комиссия — инструмент эффективной продажи, как острый скальпель у хирурга».\n\n**Если собственник работает со всем рынком сам,** он должен убрать своё объявление «от собственника» и баннер с телефоном. Иначе брокер, который показал объект клиенту, рискует, что клиент позвонит напрямую, и перестаёт объект предлагать.\n\n## Как использовать в работе\n- Аргументы против «продаю сам» и «дам нескольким агентствам»: см. [Возражения собственника](#vozrazheniya-sobstvennika).\n- Взял объект — веди себя как управляющий продажей: упаковка, партнёры, презентация для коллег, отчёты собственнику.\n\n## 📌 Как это у нас\n**Партнёрские сделки и брокер-туры мы делаем.** Поэтому «управление продажей» — не просто аргумент для собственника, а наша практика: взял объект — упакуй его, раздай партнёрам, проведи брокер-тур и регулярно отчитывайся собственнику.\n\n\n## Связанные темы\n- [Три договорённости](#tri-dogovorennosti)\n- [Подготовка объекта к показу](#podgotovka-obekta-k-pokazu)", "q": ["Почему собственнику невыгодно продавать самому?", "Почему «дам объект трём агентствам» работает хуже одного агента?", "Что такое правильный эксклюзив и почему у этого слова плохая репутация?", "Что такое «управление продажей»?", "Зачем высокая комиссия и как она связана с партнёрами?", "Делаем ли мы партнёрские сделки и брокер-туры?"]}, "obyavlenie-i-foto": {"t": "Объявление, описание, фото и рейтинг на ЦИАНе", "n": "Объявление, описание, фото и рейтинг на ЦИАНе", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Как написать описание квартиры?\n- Что нельзя писать в объявлении?\n- Где взять хорошие фото?\n- Как поднять рейтинг на ЦИАНе?\n- Как попросить клиента оставить отзыв?\n\n**Коротко:** объявление должно стоять выше конкурентов. Для этого нужны качественные фото, грамотное описание и стратегия продвижения. Описание пишется по одной структуре, из разговора с собственником берём только то, что продаёт.\n\n## Структура описания квартиры\n1. **Заголовок-первая фраза:** тип и главная фишка. Например: «Видовая евро-двухкомнатная угловая квартира в премиум-ЖК „HIDE“ с видом на Сити». Корпус, статус («в собственности»).\n2. **Планировка:** кухня-гостиная, спальни, санузлы, гардеробные.\n3. **Отделка и материалы:** конкретные бренды и материалы (паркет, шпон, сантехника), история (дизайн-проект, ручная работа).\n4. **Санузлы.**\n5. **Инженерия:** водонагреватель, защита от протечек, фильтры.\n6. **О жилом комплексе:** охрана, консьерж, инфраструктура, двор, паркинг.\n7. **Локация:** что рядом.\n8. **Финал:** «Возможна ипотека в любом банке. Звоните, если остались вопросы!»\n\n**Чего не писать:** внутреннюю логистику показа (ключи, какой лифт), бытовые проблемы (треснувшее стекло, регулировка окон), споры с застройщиком. Об этом говорят на показе, если спросят.\n\n**Коммерция (ПСН):** заголовок с площадью и главными параметрами (потолки, вход, витражи), характеристики списком, «почему это ликвидно» (трафик, жители ЖК), «под что подходит», локация. Отдельно, не в объявление: ставки аренды и окупаемость для переговоров.\n\n## Фото\n- Яндекс может отснять объект и сделать 3D-тур. Его потом можно использовать.\n- Храни исходники фото. Если удалить их и потерять доступ, восстановить кадры с площадки без водяных знаков нельзя.\n\n## Рейтинг и отзывы на ЦИАНе\n- Рейтинг считается как среднее. Пример: три единицы и шесть пятёрок дают 3,67. Снять одну единицу — 4,0. Добрать 6 пятёрок — около 4,2.\n- **Оспорить несправедливые единицы** через поддержку. Основания: не было факта сотрудничества (нет звонков, показов, переписки), оскорбления без фактов, отзыв от конкурента, дубль. Если сотрудничество было, не ври, а дави на недостоверные факты или оскорбления.\n- **Ответить публично на каждый негатив:** спокойно, с фактами, с предложением решить вопрос. Покупатель читает ответы.\n- **Просить отзыв в день сделки или передачи ключей,** когда эмоция на пике. Старых клиентов за 12–18 месяцев обзвонить лично, не рассылкой. Из 20 живых контактов реально получить 6–8 отзывов.\n- **Не писать отзывы за клиентов** от их имени: это фейк, за него режут рейтинг и банят профиль. Можно дать клиенту «рыбу»: что искали, что было сложно, что агент сделал, порекомендует ли. Или предложить наговорить голосовое.\n- В отзыве не нужна фраза «отжал цену»: собственники прочитают и решат, что ты будешь торговаться с ними. Лучше «условия согласовал так, что обе стороны остались довольны».\n- Сделай запрос отзыва частью процесса после каждой сделки, а не только когда рейтинг просел.\n\n## Связанные темы\n- [Работа по одному ЖК](#rabota-po-odnomu-zhk)\n- [Цена и снижение](#cena-i-snizhenie)", "q": ["Как написать описание квартиры?", "Что нельзя писать в объявлении?", "Где взять хорошие фото?", "Как поднять рейтинг на ЦИАНе?", "Как попросить клиента оставить отзыв?"]}, "kommentarii-v-crm": {"t": "Комментарий в CRM после звонка", "n": "Комментарий в CRM после звонка", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Что писать в CRM после звонка?\n- Насколько подробно?\n- Зачем это вообще нужно?\n\n**Коротко:** после каждого звонка в CRM остаётся выжимка: что у клиента есть, что ты говорил, что понял, о чём договорились и когда следующий шаг. Короткий звонок — 5–8 строк. Длинный насыщенный — больше, но каждая строка несёт факт.\n\n## Структура (пять блоков)\n1. **Имущество клиента:** объекты, метраж, состояние, планы (продать, сдать, жить).\n2. **Кейсы и аргументы агента:** что ты приводил в пример и чем аргументировал.\n3. **Выводы по лиду:** тёплый или холодный, кто принимает решение, ожидания по цене, есть ли другой агент, что сдерживает.\n4. **Договорённости:** что пообещали друг другу. Если ничего, так и написать.\n5. **Следующий шаг:** дата и повод следующего касания, что уточнить.\n\n## Правила\n- Не выдумывать: если цифра прозвучала нечётко, пиши «уточнить».\n- Записывать всё, что поможет в будущем: другие объекты клиента (потенциальные сделки), кто принимает решение, когда у человека «сезон» (летом активность падает, «вернусь к вопросу в сентябре»).\n- Фоновые темы разговора (бизнес клиента, инвестиции, страхи) — коротко. Они объясняют мотивацию.\n- Телефоны и паспортные данные не дублировать в текст комментария.\n\n## Пример (обезличен)\n> Повторный созвон. Машино-места продавать не интересно: сдаёт сама 2 места, вернёмся к теме в январе. По офисам думают продать часть портфеля и переложиться в новый проект. Два объекта продать нельзя (несколько собственников, спецпомещения). Два других готовы рассматривать: ритейл 50 м² с арендатором 10+ лет и помещение 250 м². Предложил продавать как готовый арендный бизнес (мультипликатор 8–10 лет аренды) — зашло, ждёт анализ. Летом активность низкая, вернётся в сентябре. Знает, кто решает по смене арендатора офиса — важный контакт.\n> Следующий шаг: написать в мессенджер, получить данные по ритейлу, сделать оценку. Контакт: сентябрь (офисы), январь (машино-места).\n\n## Связанные темы\n- [Работа на перспективу](#rabota-na-perspektivu)", "q": ["Что писать в CRM после звонка?", "Насколько подробно?", "Зачем это вообще нужно?"]}, "dozhim-i-zakrytie": {"t": "Дожим и закрытие: как не бояться и что говорить", "n": "Дожим и закрытие", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Мне стыдно и страшно дожимать клиента. Что делать?\n- Как перейти от «согласен» к «подписываем»?\n- Какие техники речи помогают закрывать?\n- Что почитать про продажи и переговоры?\n\n**Коротко:** дожим — это не «впихнуть», а помочь человеку принять решение, которое он почти принял, но боится сделать сам. Дожим — это вопрос, а не утверждение. После прямого вопроса молчи.\n\n## Как перестать бояться\n- Страх дожима обычно стоит на убеждении «дожимать = навязывать». В нашем сегменте обе стороны изначально хотят сделку. Клиент может выйти в любой момент без последствий.\n- Право на дожим появляется, когда ты честно отработал реальные возражения. Тогда закрытие — логичное завершение разговора, а не давление.\n- Маленький шаг лучше никакого: «давайте закреплю за вами просмотр на четверг, без обязательств».\n- Премиум-клиент мгновенно считывает давление и манипуляцию и уходит. Работает этичная аргументация, а не «как сломать чужое нет».\n\n## Фразы закрытия\n- «Что мешает принять решение сейчас?»\n- Иллюзия выбора: «Удобно во вторник или в четверг?», «В 7 или в 8?»\n- Вопрос о времени, а не о факте: «Когда удобно подписать договор?»\n- Спорное закрывай вопросом: «Комиссия 4%. Вам удобно встретиться в 6 или в 8?»\n- Закрытие на встречу (Димитриадис): «Как профессиональный агент я изучаю квартиры и цены каждый день, поэтому исхожу из того, что вы подпишете договор, когда мы встретимся сегодня в 6. По цене, которая приведёт к продаже вашей квартиры».\n\n## Речевые техники из лекции Димитриадиса\nБрать 3–4 техники и гонять на каждом звонке, пока не станут автоматом.\n- **Пресуппозиция:** результат как свершившийся факт. «Насколько быстро вы сможете начать?»\n- **Иллюзия выбора:** любой вариант ведёт к нужному результату.\n- **Встроенные команды через «можете» и «полезно»:** «Полезно рассмотреть это подробнее».\n- **«Чем — тем»:** «Чем внимательнее изучаете, тем быстрее решение».\n- **Неопределённый субъект:** «Все покупатели обращают внимание на транспорт».\n- **Двойная связка:** «Начнём с краткого обзора или подробного анализа?»\n- **Открытое внушение через любопытство:** «Как планируете использовать балкон после переезда?»\n- **Да-да-да:** серия согласий перед главным вопросом.\n- **Очевидная истина:** «Каждый хочет принять хорошее решение».\n- **Чтение мыслей:** «Вероятно, вы уже сравниваете с другими вариантами. Какие ощущения?»\n- **Работа с ценой через ценность:** «Да, цена важна. Но давайте посмотрим на общую ценность объекта».\n- Главное — техника задавать вопросы и соглашаться.\n\n## Что почитать (из внешних источников)\n- Роберт Чалдини, «Психология влияния».\n- Нил Рэкхем, «СПИН-продажи» — про крупные и дорогие сделки.\n- Крис Восс, «Никогда не идите на компромисс» — переговоры с эмоциями и статусом.\n- Даниэль Канеман, «Думай медленно… решай быстро» — что стоит за «я подумаю».\n\n## Связанные темы\n- [Страх звонить и отказы](#strah-i-otkazy)\n- [Встреча с собственником](#vstrecha-s-sobstvennikom)", "q": ["Мне стыдно и страшно дожимать клиента. Что делать?", "Как перейти от «согласен» к «подписываем»?", "Какие техники речи помогают закрывать?", "Что почитать про продажи и переговоры?"]}, "yuridicheskaya-baza": {"t": "Юридическая база агента: документы, ипотека, аккредитив, договоры", "n": "Юридическая база агента", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Что агент должен знать из юридики, если сделку ведёт юрист?\n- Как работает сделка с ипотекой и обременением?\n- Что такое аккредитив и как идут деньги?\n- Почему покупатель просит ДДУ, если квартира уже в собственности?\n- Нужно ли согласие супруга при сдаче в аренду?\n- Какие пункты агентского договора нельзя отдавать клиенту?\n- Чем задаток отличается от аванса?\n- Какие документы собственник готовит до выхода на рынок?\n- Что меняет нерезидентство, маткапитал, доли детей, доверенность?\n\n**Коротко:** агент создаёт сделку и принимает задаток, дальше её ведёт юрист компании. Но базу агент знает, чтобы правильно квалифицировать объект и не потерять сделку и комиссию. ⚠️ Это не юридическая консультация: сложные вопросы всегда к юристу компании.\n\n> Стажёру в первые 2 дня этот раздел не нужен. Сначала звонки, юридика со второй недели.\n\n## Документы и собственник\n- Уточняй правоустанавливающий документ и срок владения (больше пяти лет или нет).\n- Сделки с пенсионерами Росреестр проверяет внимательнее. Уточни, будет ли собственник лично на сделке.\n- Объединённые или разделённые квартиры: один кадастровый номер или несколько, готовы ли указать полную стоимость.\n- Документы собственник показывать не обязан. Обычно их запрашивают, когда договорились о цене, или заказывают юридическую проверку.\n- Выписку после сделки бывший собственник заказывает сам через mos.ru. Агенту откажут.\n\n**Почему покупатель просит ДДУ, хотя квартира в собственности.** Выписка ЕГРН показывает только, кто собственник сегодня и есть ли обременения. Она не показывает, как возникло право: была ли уступка, рассрочка, залог у застройщика, состоял ли продавец в браке. Для квартиры от застройщика правоустанавливающий документ — это и есть ДДУ плюс акт приёма-передачи. Такой пакет просит любой юрист покупателя и любой банк при ипотеке. Если продавец не хочет показывать цифры: «замажьте цену и порядок расчётов, оставьте стороны, объект и подписи».\n\n**Выписка ЕГРН и документ-основание.** Нормально, что выписка «моложе» основания. Например, брачный договор 2024 года и свежая выписка 2026 года, которая подтверждает, что право действует.\n\n## Юридическая готовность до выхода на рынок (из внешнего источника: А. Аверьянов)\nСделки разваливаются, когда проблемы с документами всплывают уже при найденном покупателе. Собственник готовит всё заранее:\n- **Правоустанавливающие документы** и история перехода прав.\n- **Выписка ЕГРН.** С 1 марта 2023 года сведения о правообладателе в выписке видит только сам собственник (или по его согласию). Значит, заказывать её по первому запросу покупателя должен собственник.\n- **Перепланировки.** Неузаконенная перепланировка мешает ипотечным покупателям. Узаконивание идёт долго, но расширяет круг покупателей.\n- **Загородная недвижимость:** все строения зарегистрированы (сарай или гараж без оформления может сорвать сделку).\n- **Аресты и запреты.** Собственник может не знать о них — проверить.\n- **Переуступка по ДДУ.** Узнать позицию застройщика: некоторые ограничивают уступки.\n- **Налоги.** Посчитать заранее и учесть в цене. Если собственник больше 183 дней в году за границей, он налоговый нерезидент, ставка НДФЛ 30%. Подробности — к юристу.\n- **Долги по коммуналке.** Покупатель видит их как сигнал срочности и давит в торге.\n- **Согласие супруга** у нотариуса или брачный договор — заранее. Если супруг окажется за границей, согласие через консульство займёт время, и сделка может сорваться.\n- **Прописанные лица:** как их выпишут к сделке.\n- **Доли детей,** в том числе из-за материнского капитала (даже 450 тысяч в квартире за 100 млн дают детям доли) — сделка через опеку, нужно понимать, что купят детям взамен. Такие объекты часто идут с дисконтом.\n- **Доверенность,** если собственник не сможет быть на сделке. Учитывай, что к продаже по доверенности относятся настороженно, это может стоить дисконта.\n- **Справки из ПНД и НД** покупатель иногда просит. Лучше сделать.\n\n## Документы по объекту (методичка)\n- **Правоподтверждающий:** свежая выписка ЕГРН (до июля 2016 года — свидетельство о регистрации права).\n- **Документы-основания:** ДКП; ДДУ и акт приёмки; свидетельство о наследстве; договор дарения; решение суда; справка ЖСК о выплате пая; документы о приватизации.\n\n| Документ | Зачем |\n|---|---|\n| Выписка из домовой книги | Кто прописан и выписан. Право пожизненного проживания после приватизации — серьёзный риск |\n| Справка об отсутствии долгов по ЖКХ | МФЦ или управляющая компания |\n| Финансовый лицевой счёт | Жильцы, долги, прописанные, характеристики |\n| Справка о погашении ипотеки | Если не погашена — согласие банка или погашение из денег покупателя |\n| Документы БТИ | Были ли перепланировки и узаконены ли |\n| Паспорт собственника | Проверка действительности на сервисе МВД |\n| Справки ПНД и НД | Недееспособность — основание признать сделку недействительной |\n| Согласие супруга | Если куплено в браке; альтернатива — брачный договор |\n| Разрешение опеки | Если есть несовершеннолетние: положение ребёнка не должно ухудшиться |\n| Кредитная история | Риск банкротства продавца; бесплатно дважды в год на Госуслугах |\n\n## Право собственности и формы собственности\n- **Первичное возникновение:** приватизация, ЖСК, ДДУ, жилищные сертификаты. **Вторичное:** договор (купли-продажи, ренты, дарения, мены), наследство, решение суда.\n- **Индивидуальная** — один владелец. **Общая совместная** — доли не определены и считаются равными. **Долевая** — у каждого своя доля («на бумаге», ½ или ¼; реальные доли сейчас не выделяют).\n\n## Агентский договор\n**Три вида:** на подбор (работаем со стороны покупателя), на продажу, на продажу с альтернативой (при альтернативе иногда удобнее два договора — уточни у юриста).\n\n**Как заполнить договор на продажу:**\n- Номер присваивает менеджер по работе с юристами, дата — текущий день.\n- ФИО всех собственников или их представителей по нотариальной доверенности.\n- Со стороны агентства подписывает РОП или юрист; при доверенности — её номер и дата.\n- П. 1.1.1.1 — объект точно как в документах (комнаты, тип, площадь, адрес, кадастровый номер). Апартаменты по закону — нежилое помещение, так и пишем.\n- П. 1.2 — правоустанавливающие документы всех собственников. П. 2.1.10 — несколько телефонов и e-mail. П. 3.1 — срок обычно 3 месяца. П. 4.8 — кто из собственников подписывает дальнейшие документы.\n- **П. 5 — дополнительные условия. Все правки только сюда, сам текст договора не правим.** П. 6 — подписывают все собственники или доверенное лицо.\n\n**Приложения:** о стоимости (цена выхода на рынок, по итогу доп. соглашением до цены сделки); о комиссии (сумма в рублях, по итогу корректируется от реальной цены); промежуточные акты о проделанной работе и окончательный отчёт. Соглашение об авансе готовит юрист, если есть чек-лист по сделке, подписанный агентский договор и документы.\n\n**Что показать собственнику в договоре:** п. 1.4 — минимальная комиссия, итог в рублях в доп. соглашении; п. 1.5 — расходы на оформление сделки оплачивает покупатель; п. 2.3.9 — до сделки клиент ничего не платит, оплата не позднее 3 рабочих дней после регистрации права на покупателя.\n\n## Задаток и юрист (регламент)\n- **Задаток — это обязательство.** Защищает и продавца, и покупателя, фиксирует цену, дату сделки и условия, засчитывается в оплату. **Аванс — предоплата без гарантий.** С собственниками заключаем именно договор задатка.\n- Избегай ситуаций, когда стороны хотят выйти на сделку без задатка.\n- Как только согласованы день и время задатка, подключай юриста. До передачи в юридический отдел: подписать агентский договор (в сложных случаях можно подключить юриста) и заполнить **чек-лист по сделке** (CRM: Обучение → Материалы).\n- Задаток проводится в офисе, удалённо или на территории одной из сторон. С момента задатка или аванса сделку ведёт юрист.\n\n## Формы оплаты покупателем\n| Форма | Как | Когда продавец получает деньги |\n|---|---|---|\n| Свободные деньги | Ячейка или аккредитив | Сразу после регистрации права |\n| Ипотека | Покупатель одобрен; объект без обременения или обременение в том же банке | После регистрации права |\n| Материнский капитал | Вместе с наличными или ипотекой | Через 30–45 дней после регистрации |\n\nРегистрируется право собственности, а не договор купли-продажи.\n\n**Ипотека в двух словах:** банк даёт 80–90%, взнос покупателя 10–20% (есть программы без взноса и со взносом маткапиталом). Есть льготные программы. Банк учитывает доход семьи, возраст заёмщика обычно 21–75 лет, срок до 30 лет. Платежи сейчас аннуитетные. Залог — сама квартира. Калькулятор ипотеки — на estateliga.com.\n\n## Ипотека и обременение\n- Обременение значит, что квартира в залоге у банка.\n- Три вопроса: какой банк, есть ли просрочки, как гасит — сам до сделки или из денег покупателя.\n- «После сделки» не бывает: банк не проведёт сделку с обременением.\n- В разных банках такая сделка стоит от 5 до 50 тыс. ₽, некоторые проводят её только раз в месяц, в день платежа. Банк узнаём сразу.\n- Если у собственника нет денег погасить самому, гасим из денег покупателя через аккредитив.\n\n## Как идут деньги (аккредитив)\nПочти все сделки идут через аккредитив, защищённый счёт в банке. Ячейка используется редко.\n1. Покупатель кладёт деньги на аккредитив (наличные сначала вносит на свой счёт). При ипотеке открывают два: на погашение ипотеки и собственнику.\n2. Документы на регистрации обычно 3–5 дней.\n3. После регистрации банк раскрывает аккредитив, и за 1–2 рабочих дня деньги приходят собственнику.\n\nРасходы на сделку (госпошлина, аккредитив, новые документы) в основном несёт покупатель. Квартира под задатком снимается с ЦИАНа, иначе могут заблокировать аккаунт.\n\n## Агентский договор: что нельзя отдавать\nЕсли клиент правит наш агентский договор, проверь, не ушли ли эти пункты (по убыванию риска):\n1. **«и/или» в условии вознаграждения.** «Агентство выполнило п. 1.1.1 и/или 1.1.2» — комиссия положена, если нашли покупателя ИЛИ провели сделку. Если клиент меняет на «и», то при сделке в обход нас (покупатель наш, сделка без нас) комиссии формально нет.\n2. **Право удержания** денег или документов до расчёта (ст. 359–360 ГК). Без него остаётся только суд.\n3. **Право принять аванс или задаток** от покупателя от имени клиента.\n4. **Обязанность клиента содействовать сделке:** выдать доверенность, дать согласие супруга, подписать ПДКП, явиться на аванс.\n5. **Автопролонгация.** Без неё договор умирает в срок, и клиент может уйти к другому агенту, когда покупатель уже найден.\n6. Срок на возражения по акту (было 1 рабочий день).\n\n**Неустойку «не продали за месяц — платите» в договор не ставим.** Собственник может отказать всем покупателям и выиграть суд.\n\n## Задаток и аванс, ПДКП\n- Задаток и аванс — разные вещи. Задаток обеспечивает обязательство (при отказе стороны действуют правила задатка), аванс — просто предоплата.\n- Если юрист покупателя переименовывает предварительный договор (ПДКП) в «договор задатка» и вычищает конструкцию предварительного договора, задаток может быть переквалифицирован в аванс. Это риск для продавца. Правки другой стороны проверяй в режиме рецензирования и обязательно отдавай юристу.\n\n## Согласие супруга при аренде\n- **Договор до года** (обычно 11 месяцев) не регистрируется. Нотариальное согласие по закону не требуется, работает презумпция согласия (п. 2 ст. 35 СК РФ).\n- **Договор на год и больше** регистрируется, нужно нотариальное согласие супруга.\n- Пункт «супруг не против» в договоре — это заверение со слов собственника, а не согласие самого супруга. Он защищает арендатора деньгами (убытки, если заверение ложное), но не связывает супруга.\n- Чтобы закрыть страх арендатора полностью, супруг расписывается в договоре сам или даёт нотариальное согласие.\n- Арендатора успокоит факт: супруг не может прийти и выгнать. Договор действует, пока его не признает недействительным суд.\n\n## Акт просмотра\nЕсли показываешь покупателю объект другого агентства, возьми с покупателя подписанный акт просмотра (дата, адрес, подпись). Это доказательство твоего участия, но одного акта мало, чтобы взыскать комиссию. Усиливают позицию договор с покупателем на подбор и переписка с агентством продавца о показе и разделе комиссии.\n\n## Связанные темы\n- [Путь сделки](#put-sdelki)\n- [Три договорённости](#tri-dogovorennosti)", "q": ["Что агент должен знать из юридики, если сделку ведёт юрист?", "Как работает сделка с ипотекой и обременением?", "Что такое аккредитив и как идут деньги?", "Почему покупатель просит ДДУ, если квартира уже в собственности?", "Нужно ли согласие супруга при сдаче в аренду?", "Какие пункты агентского договора нельзя отдавать клиенту?", "Чем задаток отличается от аванса?", "Какие документы собственник готовит до выхода на рынок?", "Что меняет нерезидентство, маткапитал, доли детей, доверенность?"]}, "kross-prodazhi": {"t": "Звонки собственникам элитных ЖК и кросс-продажи", "n": "Звонки собственникам элитных ЖК и кросс-продажи", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Как звонить собственникам делюкс-объектов, у которых нет времени?\n- Как предложить собственнику купить квартиру в другом проекте?\n- Какой проект предлагать владельцу из конкретного ЖК?\n- Чем отличается звонок «на продажу» от звонка «на покупку»?\n\n**Коротко:** собственник элитного ЖК — человек с деньгами и без времени. Стандартный заход «здравствуйте, я агент, можно пару вопросов» убивает звонок за 5 секунд. Формула: 15 секунд до сути → один факт → один вопрос → закрытие. Владельцы делюкса — квалифицированные покупатели, поэтому им можно предлагать новые проекты (кросс-продажа).\n\nДословные скрипты: [Скрипт](#skript-kross-prodazhi).\n\n## Два типа звонка\n| | Звонок «на продажу» | Звонок «на покупку» (кросс-продажа) |\n|---|---|---|\n| Повод | Их объект: «у меня покупатель на вашу квартиру» | Их статус: «вы из тех, кто понимает делюкс, у меня новость с рынка» |\n| Готовый ЖК | Продать или сдать сейчас, пока рынок активен | Новый проект того же уровня |\n| ЖК на стройке (ДДУ) | Переуступка до сдачи: зафиксировать рост цены, пока не платишь за готовое | Второй такой же актив |\n\n## Принципы\n- Без «меня зовут, я представляю агентство». Сразу факт и причина звонка.\n- Вопрос закрытый и быстрый: «рассматриваете или нет».\n- Перевод в мессенджер — это нормально: они посмотрят, когда удобно.\n- Всегда мягкий выход, если «нет». База большая, контакт нельзя сжечь на первом звонке, нужно оставить себе право написать через 2–3 месяца.\n- Звонок «на покупку» — это не «впарить», а дать инсайдерскую информацию раньше остальных.\n\n## Логика подбора пары «текущий ЖК → что предложить»\nСильнее всего работает одно из трёх:\n1. **Тот же застройщик:** «вы уже доверились этому бренду, у них новый проект».\n2. **Тот же район или тип продукта:** особняк к особняку, усадьба к клубному дому в исторической застройке.\n3. **Апгрейд:** лучше вид, выше формат.\n\nПример: владельцам Армани Каса предлагаем клубный дом «Казачий» (Якиманка, 79 резиденций, трейд-ин: можно зачесть текущую квартиру в оплату новой). Полная матрица на 8 ЖК — в скрипте.\n\n**Формула предложения:** локация → цена → фишка.\n\n\n## Связанные темы\n- [Наш клиент](#segment-i-klient)\n- [Возражения при звонке на покупку](#vozrazheniya-pri-zvonke-na-pokupku)", "q": ["Как звонить собственникам делюкс-объектов, у которых нет времени?", "Как предложить собственнику купить квартиру в другом проекте?", "Какой проект предлагать владельцу из конкретного ЖК?", "Чем отличается звонок «на продажу» от звонка «на покупку»?"]}, "vozrazheniya-sobstvennika": {"t": "Возражения собственника: готовые ответы", "n": "Возражения собственника", "sec": "04-objections", "md": "**Отвечает на вопросы:**\n- Что ответить, если собственник говорит «не даю рекламу»?\n- …«приходите с покупателем»?\n- …«не плачу комиссию» или «плачу 1%»?\n- …«не работаю с агентами» или «продаю сам»?\n- …«работаю с несколькими агентствами»?\n- …«у меня уже есть агент»?\n- …«агенты бесполезны»?\n- …«берите комиссию с покупателя»?\n- …«в объявлении всё написано»?\n- …«перезвоните через месяц»?\n- …«снижаться не буду»?\n- …«дайте гарантию»?\n- …«я сама риелтор»?\n- …«зачем встречаться, всё есть в объявлении»?\n- …«другой агент сказал, что снизил бы комиссию»?\n- …«у меня есть знакомый агент»?\n\n**Коротко:** главных возражений три: «приходите с покупателем», «не плачу комиссию», «не даю рекламу». Остальные побочные. Выучи по 5 отработок на каждое главное и сначала просто читай с листа. **Каждая отработка заканчивается вопросом.**\n\n## Вопросы-отработки из регламента компании\nРегламент: основной скрипт и возражения не менялись годами, поэтому их просто учат наизусть. Отвечаем вопросом (техника «вопрос — ответ — вопрос»).\n\n| Возражение | Вопросы |\n|---|---|\n| «Агенты бесполезны» | Раньше продавали или работали с агентом? Какие методы сейчас используете для продажи? А вы знаете, какие методы использую я? Что должен сделать агент, что вы от него ожидаете? Сколько квартир вы уже продали? |\n| «Не работаю с агентами» / «продаю сам» | Вы когда-нибудь продавали квартиру с агентом? Почему решили продавать сами? Какие методы используете? Что должно произойти, чтобы вы решили работать с агентом? |\n| «Приходите с покупателем» | Откуда появится покупатель, если я не видел квартиру и не знаком с вами? Как я презентую квартиру, которую не видел? Вы работаете с агентами, которые привели покупателя, не видя квартиру? Что важнее: сэкономить 15–20 минут или вложить их в выгодную сделку? Как я квалифицирую покупателя, чтобы не было пустого показа? Вы хотите, чтобы квартиру купили или просто посмотрели? |\n| «У меня уже есть агент» | Как вы выбрали этого агента? Уже продавали с ним? Он работает по этому ЖК? Какие методы использует? Давно работаете? Хотите услышать ещё одно профессиональное мнение? Что важнее: кто из агентов продаст или максимальная цена за квартиру? |\n| «В объявлении всё написано» | Вы бы купили квартиру по фотографиям? Почему считаете, что так сделает покупатель? Как я могу презентовать квартиру покупателю? Сколько квартир вы продали? |\n| «Не плачу комиссию» / «большие комиссионные» | Как вы определили цену? Что для вас большие комиссионные? Что должен сделать агент за такую комиссию? Какие методы использует агент, работающий за 1%? Вы готовы заплатить комиссию за покупателя? Хотите сэкономить на комиссии? Сколько покупателей сейчас готовы купить вашу квартиру? Сколько было показов? В какие сроки хотите продать? |\n| «Берите комиссию с покупателя» | Вы работали с агентами? Знаете, как получить самую выгодную цену? Хотите, чтобы весь рынок знал о вашей квартире? Сейчас весь рынок о ней знает? Знаете разницу между агентом покупателя и агентом собственника? Как вы оценивали квартиру? |\n\n## «Не даю рекламу» / «не выставляйте на ЦИАН»\n1. «Как моя реклама помешает продаже вашей квартиры? У нас одна цель — продать, так?» Повторяй этот вопрос, пока не получишь причину.\n2. «Вы сами выставили квартиру в открытый доступ, её уже видят все. Что изменит моё объявление?»\n3. «Покупатель видит на ЦИАНе два объявления, моё и ваше. Кому он позвонит?» — «Вам». — «Вот. Я с вами за звонки с ЦИАНа не конкурирую. Объявление нужно, чтобы предлагать квартиру покупателям, которые пришли на наши объекты, и клиентам коллег. Вы же хотите, чтобы о квартире узнало как можно больше покупателей?»\n4. «Вы правда думаете, что агент просто перешлёт покупателю вашу ссылку, чтобы тот позвонил вам напрямую? У вас были агенты, которые так работали? Чем закончилось?»\n5. Ссылаются на другого агента: «У вас эксклюзивный договор? Тогда почему вы сами рекламируетесь?»\n\n## «Приходите с покупателем»\n1. «У вас уже были агенты, которые сразу соглашались прийти с покупателем? К чему это привело?» Обычно пришли, посмотрели, ушли.\n2. «Агенты, которые готовы сразу привести покупателя, либо приведут нецелевого, либо работают на покупателя и действуют в его интересах, а не в ваших».\n3. «Мне есть кому предложить квартиру, но предлагать квартиру, в которой я сам не был, я не могу. Могу подъехать после одного из ближайших показов. У вас показы сегодня или завтра вечером?»\n4. «У меня есть покупатели на ваш метраж. Чтобы их привести, нужны три простые договорённости: доступ для показов, презентация и комиссия. В лице меня вы покажете квартиру более чем 15 покупателям».\n5. «Вы хотите, чтобы я предложил квартиру одному покупателю или всем? Тогда давайте сделаем нормальную презентацию, и коллеги тоже смогут её предлагать».\n\n## «Не плачу комиссию» / «дорого» / «плачу 1%»\n1. «Почему?» или «Как вы оценили работу агента в 1%?» Сначала узнать причину.\n2. «Вы платите не за бейджик агента, а за покупателя, который отдаст вам 30 миллионов. Сегодня на одного покупателя 15–20 квартир, и покупатель на рынке стоит 4%».\n3. «Каждая работа должна быть оплачена? Я привожу человека, который платит вам 32 миллиона, а получаю за это „спасибо“. Согласитесь, странно?»\n4. «Какой торг вы закладывали? Давайте заложим мою комиссию в торг. Если продам без торга, могу рассчитывать на комиссию?»\n5. «У вас были агенты, которые согласились на меньшую комиссию? Как с ними продвигается?»\n\n## «Не работаю с агентами» / «продаю сам» / «мне не к спеху»\n1. «Как долго планируете продавать сами, прежде чем привлечёте правильного агента?»\n2. «Какие методы продажи используете?» — «ЦИАН и Авито». — «Выставить на ЦИАН — один инструмент. На одного покупателя 15–20 квартир. Чтобы продать, нужна сфера влияния в комплексе».\n3. «Что будете делать, если не продадите за два месяца?»\n4. «Мне не к спеху» → «Отлично, значит, есть время выбрать выгодное предложение. Для этого нужно собрать все предложения на рынке, а это возможно, только если охватить всех покупателей».\n5. «Покупатель всё равно купит в ближайшее время. Вопрос — какую квартиру. Хотите, чтобы вашу?»\n\n**Аргументы из внешнего источника (видео А. Аверьянова):**\n- «Основной трафик покупателей в нашем сегменте не на ЦИАНе, а у агентств. Брокер покупателя предлагает только объекты, где собственник работает с агентами. Ваша квартира в эти подборки не попадает».\n- «Кто звонит по объявлению „от собственника“? Агенты и покупатели, которые хотят сэкономить на комиссии и будут торговаться по максимуму. Сэкономит покупатель, а не вы».\n- «Чтобы выделиться самому, нужна суперупаковка и платный топ, это сотни тысяч, или цена ниже рынка. Это дороже комиссии».\n\nЕсли собственник выходит на сделку сам, продаём свои услуги как дополнительный сервис и ни в коем случае не спорим (Димитриадис).\n\n## «Работаю с несколькими агентствами» (из внешнего источника)\n- «Когда объект у трёх агентств, ни у кого нет гарантии комиссии. Кто будет вкладываться в фото, презентацию и звать партнёров? У семи нянек дитя без глаза».\n- «Один и тот же покупатель звонит в три агентства, и кажется, что покупателей много. Сколько реальных предложений у вас было?»\n- «Даже пять крупнейших агентств — это меньше 20% рынка. Полный охват даёт один ответственный агент, который раздаёт объект всем партнёрам».\n\n## «У меня уже есть агент»\n- «Почему он пока не продал? Почему вы до сих пор сами принимаете звонки?»\n- «Как вы выбрали этого агента? Он работает по этой локации? Если в его прайсе только ваша квартира, единственный инструмент — выставить на ЦИАН и ждать».\n- «Что будете делать, если он не продаст за два месяца?»\n- На «это не ваше дело»: «Это моё дело, потому что вы вышли на агентскую площадку, а я звоню с конкретным предложением: у меня есть целевые покупатели на ваш метраж».\n\n## «Перезвоните через неделю / месяц»\nЭто вежливый отказ. Заставь подумать:\n- «А что произойдёт через месяц, что мой звонок станет вам интересен?»\n- Если ждут одного покупателя: «А если он не купит? Задаток внёс? Нет? Тогда зачем терять неделю в сезон и не предлагать квартиру другим?»\n\n## «Хочу ровно 30, снижаться не буду»\nСм. [Цена и снижение](#cena-i-snizhenie): «Как определили цену?», «Почему именно эта сумма?», «Что будет, если квартира простоит год?», «влюбить покупателя», пример с iPhone.\n\n## «Дайте гарантию: не продадите за месяц — платите неустойку»\n- «Вы готовы полностью следовать моим рекомендациям, включая корректировку цены? Как я могу гарантировать результат, не влияя на главный фактор?»\n- «Я работаю до факта сделки, вкладываюсь в маркетинг и не прошу ни рубля заранее. И вы хотите, чтобы я ещё платил штраф за то, что старался? Тогда вы готовы заплатить двойную комиссию, если продам быстро?»\n- Неустойку в договор не ставим: собственник может отказать всем покупателям и выиграть суд.\n\n## «Я сама риелтор, зачем мне платить?»\n- «Вы платите не за услуги риелтора, а за покупателя. Покупатель сегодня стоит 4%».\n- Если готова работать только «как с представителем покупателя», фиксируй и договорись о следующем звонке.\n\n## «Зачем встречаться, всё есть в объявлении»\n- «Понимаю, что сейчас я для вас просто голос в телефоне. Поэтому предлагаю встретиться: познакомиться и обсудить, как мы можем быть полезны друг другу».\n- «Уделите мне 15 минут. Могу подъехать в офис, на обед, куда удобно».\n- «Вам звонят десятки агентов. Дайте мне шанс проявить себя. В 7 или в 8 будет удобно?»\n\n## На встрече (Димитриадис)\n**«Другой агент сказал, что снизил бы комиссию»:** «Я вас понял. Могу сказать, почему меня это раздражает? Если другие агенты не имеют смелости отстоять свою ценность, насколько сильными они будут, защищая вас и цену вашей квартиры? Я эту смелость имею. Вы чувствуете, что я могу продать вашу квартиру? — Да. — Превосходно. Всё, что нужно сейчас, — подписать договор, чтобы я помог получить то, что вы хотите, в сроки, которые вы хотите».\n\n**«У меня есть знакомый агент»:** «Понимаю, знакомый есть почти у каждого. Позвольте спросить: вам нужно продать квартиру или сделать знакомому одолжение? Вы ведь согласились встретиться со мной не просто так. Вы верите, что я могу продать?»\n\n**Страх работы с агентом:** «Поделитесь, чтобы я понимал вашу ситуацию и чего вы опасаетесь».\n\n## Слова, которые не используем\n- «Непрофессионально»: собственнику всё равно, профессионально это для агента или нет.\n- «Горячий» (о клиенте или объекте): жаргон, каждый понимает по-своему.\n\n## Связанные темы\n- [Скрипт звонка собственнику](#skript-zvonka-sobstvenniku)\n- [Три договорённости](#tri-dogovorennosti)", "q": ["Что ответить, если собственник говорит «не даю рекламу»?", "…«приходите с покупателем»?", "…«не плачу комиссию» или «плачу 1%»?", "…«не работаю с агентами» или «продаю сам»?", "…«работаю с несколькими агентствами»?", "…«у меня уже есть агент»?", "…«агенты бесполезны»?", "…«берите комиссию с покупателя»?", "…«в объявлении всё написано»?", "…«перезвоните через месяц»?", "…«снижаться не буду»?", "…«дайте гарантию»?", "…«я сама риелтор»?", "…«зачем встречаться, всё есть в объявлении»?", "…«другой агент сказал, что снизил бы комиссию»?", "…«у меня есть знакомый агент»?"]}, "vozrazheniya-pri-zvonke-na-pokupku": {"t": "Возражения при звонке на покупку (кросс-продажа) и в переписке", "n": "Возражения при звонке на покупку", "sec": "04-objections", "md": "**Отвечает на вопросы:**\n- Что ответить на «откуда у вас мой номер»?\n- …«не продаю»?\n- …«сколько стоит моя квартира»?\n- …«работаю с другим агентом»?\n- …«какой покупатель? дайте конкретику»?\n- …«без комиссии, только напрямую»?\n- …«у меня есть свой брокер, он всё присылает»?\n- …грубость, «не пишите мне»?\n\n**Коротко:** в переписке и при звонке «на покупку» цель — удержать диалог или вежливо закрыть его, оставив дверь открытой. Не дави и не спорь. База большая, контакт нельзя сжечь.\n\n## В переписке с собственником\n**«Откуда у вас мой номер?»**\n1. «Из открытых источников, по дому я работаю системно. Рассылок не делаю, написал один раз и по делу. Если тема неинтересна, скажите, удалю номер и больше не побеспокою».\n2. «Собираю данные по дому из открытых баз, это часть моей работы. Ничего личного. Если не актуально, так и напишите, я пойму».\n\n**«Не продаю»**\n1. «Понял вас, спасибо за ответ. Держать квартиру в [ЖК] — нормальное решение. Если захотите узнать цену, напишите, посчитаю бесплатно».\n2. «Хорошо. Тогда один вопрос: если появится покупатель с ценой ощутимо выше рынка, вам такое показывать или лучше не тревожить?»\n\n**«Сколько стоит моя квартира?»**\n1. «Посчитаю нормально, не наугад. Подскажите корпус, этаж, метраж и есть ли отделка с мебелью — пришлю расчёт по реальным сделкам в доме».\n2. «Дам сразу две цифры: за сколько реально уйдёт и с какой выставлять в рекламу, они всегда разные».\n\n**«Сдаю / уже сдана»**\n1. «Понял. Подскажите, до какого месяца договор? Ближе к сроку напишу и покажу ставки по дому — посмотрите, не дёшево ли сдаёте».\n2. «Хорошо. Если жильцы съедут — по дому запросы идут постоянно, найду быстро. Написать, когда освободится?»\n\n**«Работаю с другим агентом»**\n1. «Так и должно быть, переманивать не собираюсь. Я работаю по дому и веду своих покупателей. Если ваш агент готов работать вместе, дайте контакт, свяжусь напрямую».\n2. «Понял вас. Тогда побуду в стороне: если продажа затянется, напишите, расскажу, что на самом деле происходит с ценами в вашем корпусе».\n\n**«Какой покупатель? Дайте конкретику»**\n1. «Ищут ваш метраж, деньги есть, дом смотрят не первый месяц, несколько вариантов не подошли. Имя без их согласия не назову, это нормально. Скажите цену — покажу и передам, что ответили».\n2. «Справедливый вопрос. По бюджету и срокам расскажу голосом: в переписке у всех агентов это звучит одинаково. Пять минут разговора, и сами поймёте, настоящий он или нет. Когда удобно позвонить?»\n\n**Грубость / «не пишите мне»:** «Понял, номер удаляю. Извините за беспокойство». Или: «Всё, больше не побеспокою. Хорошего дня».\n\n## При звонке на покупку (кросс-продажа)\nОтработки из файла «Возражения 10 × 5» (📌 подготовлено с Claude, автор использует на звонках). У каждого ответа указана техника.\n\n### 1. «Мне неинтересно»\n*Самый частый и самый неинформативный отказ — не называет причину, поэтому первая задача — либо мягко выйти, либо зацепить причиной.*\n\n1. **Любопытство.** «Понимаю, у вас может не быть запроса прямо сейчас. Можно одну фразу — а если бы был, какой формат вас бы заинтересовал, чтобы я не звонил с тем, что точно не подойдёт?»\n2. **Уточнение причины.** «Хорошо, просто чтобы я зря не отвлекал — неинтересна сама тема недвижимости, или именно этот проект?»\n3. **Мягкий выход.** «Понял, спасибо что сказали прямо. Не буду навязывать — оставлю свой номер, если что-то поменяется, обращайтесь.»\n4. **Социальное доказательство.** «Понимаю. Просто для контекста — мне сейчас звонят несколько собственников из вашего же ЖК с похожим запросом, поэтому я и обращаюсь к вам в первую очередь.»\n5. **Дефицит.** «Хорошо, тогда коротко: таких лотов на рынке в этом году будет буквально несколько, поэтому я и звоню сейчас, а не через полгода.»\n\n### 2. «У меня есть свой брокер, он мне всё присылает»\n*Не спорить с лояльностью к своему агенту — позиционировать себя как дополнение, а не замену.*\n\n1. **Не конкурируем.** «Отлично, что у вас есть свой человек — я не предлагаю его менять, просто у меня конкретный лот, которого может не быть в его базе, я работаю напрямую с этим ЖК/застройщиком.»\n2. **Проверка актуальности.** «Понимаю. Тогда вопрос — присылал ли он вам уже что-то именно по [проект]? Если нет — возможно, у меня информация раньше дойдёт до вас, чем через него.»\n3. **Второе мнение.** «Хорошо, тогда не как замену, а как второе мнение — пришлю вам напрямую, а вы сравните с тем, что показывает ваш брокер.»\n4. **Эксклюзивность лота.** «Понял вас. Этот конкретный лот я не размещаю в открытых базах, поэтому через стандартного брокера он может просто не дойти.»\n5. **Уважение + мягкое закрытие.** «Принимаю это, не буду настаивать. Просто оставлю контакт — если захочется свериться напрямую с рынком, обращайтесь.»\n\n### 3. «Неактуально» / «не сейчас»\n*Часто означает «не вовремя», а не «никогда» — важно понять временной горизонт и оставить лёгкий повод вернуться.*\n\n1. **Уточнение срока.** «Понимаю, а если не сейчас — то когда вернуться к этому разговору, чтобы я позвонил не зря?»\n2. **Без давления.** «Хорошо, тогда просто оставлю информацию у себя — если ситуация изменится, у вас будет к чему вернуться.»\n3. **Конкретизация.** «Понял. Уточню — неактуально совсем, или просто не вовремя сейчас?»\n4. **Лёгкий повод остаться на связи.** «Ничего страшного, тогда я не буду звонить часто — раз в несколько месяцев буду давать знать о действительно стоящих вариантах.»\n5. **Ценность без обязательств.** «Хорошо, тогда просто для информации — сейчас цена входа минимальная, через полгода такого предложения может не быть. Решать в любом случае вам.»\n\n### 4. «Пришлите материалы, я посмотрю»\n*Часто способ вежливо закончить звонок. Задача — закрепить конкретный следующий шаг, а не просто отправить и потерять контакт.*\n\n1. **Закрепление следующего шага.** «Конечно, пришлю сейчас. Чтобы не потерялось — скажите, удобно если я напишу через 2-3 дня уточнить, дошло ли и есть ли вопросы?»\n2. **Устная выжимка перед материалами.** «Пришлю, и пока вы смотрите — два слова: [короткое УТП]. Это то, ради чего я и звоню, остальное уже в материалах.»\n3. **Проверка реального интереса.** «Хорошо. Просто чтобы я понимал — в материалах будет цена и планировки, вам интересен конкретный метраж, или смотрите в целом?»\n4. **Выбор канала.** «Пришлю в Telegram или WhatsApp — как удобнее?»\n5. **Условие без навязчивости.** «Отправил. Если за неделю не появится вопросов — посчитаю, что не зашло, и больше не побеспокою по этому проекту.»\n\n### 5. «Дорого»\n*Не спорить с оценкой, а перевести разговор на основания цены или на альтернативный диапазон в том же проекте.*\n\n1. **Контекст рынка.** «Понимаю. По рынку это сейчас одна из адекватных цен в этом сегменте — могу показать, с чем сравнивать, чтобы было видно, на чём основана цена.»\n2. **Разбивка ценности.** «Соглашусь, сумма не маленькая, но это и не массовый продукт — цена держится на дефиците формата, а не на наценке.»\n3. **Альтернативный метраж.** «Понял, а если рассматривать меньший метраж или другой формат в том же проекте — диапазон цены другой, могу прислать варианты.»\n4. **Долгосрочная логика.** «Дорого относительно чего? Если сравнивать с ростом цены за последний год в этом районе — вход сейчас всё равно ниже, чем будет через полгода.»\n5. **Открытый вопрос без спора.** «Принимаю. Какая цифра была бы для вас комфортной отправной точкой, чтобы я понимал, в каком классе объектов вам дальше предлагать?»\n\n### 6. «Откуда у вас мой номер?»\n*Вопрос про доверие, а не про логистику — нужна прозрачность и право на отказ, без оправданий.*\n\n1. **Прозрачность источника.** «Хороший вопрос. Я работаю с базой собственников элитной недвижимости Москвы по открытым и партнёрским источникам — Росреестр, агентские базы, открытые объявления. Ваши данные есть там как собственника объекта в [ЖК].»\n2. **Профессиональный контекст.** «Это часть моей работы как агента в премиум-сегменте — я веду базу собственников по конкретным ЖК для подбора и продаж, без передачи третьим лицам.»\n3. **Снятие напряжения.** «Понимаю беспокойство, это нормальный вопрос. Звонок разовый, не из колл-центра — я работаю лично, без массовых рассылок.»\n4. **Право на отказ.** «Если неудобно, что я обращаюсь напрямую — скажите, я уберу вас из контактов и не побеспокою больше.»\n5. **Конкретика без увиливания.** «Контакт из открытой агентской базы по собственникам [ЖК] — это стандартная практика на рынке премиум-недвижимости.»\n\n### 7. «Я уже видел этот проект, неинтересно»\n*Не повторять то же предложение — выяснить, что именно отвергли, и предложить иначе или другой вариант.*\n\n1. **Уточнение причины отказа.** «Понял. Можно спросить, что именно не подошло — цена, локация, формат? Возможно, с тех пор условия поменялись.»\n2. **Новая информация.** «Хорошо, просто на случай — с момента, когда вы смотрели, могли измениться цена или доступные лоты, иногда стоит сверить заново.»\n3. **Не повторяем то же самое.** «Принял, не буду повторять то, что вы уже видели. Тогда коротко — что вообще было бы интересно посмотреть, чтобы я предлагал по-другому?»\n4. **Мягкое закрытие.** «Хорошо, спасибо за честность — не буду навязывать этот проект, оставлю контакт на будущее.»\n5. **Альтернатива.** «Понял. Если этот не зашёл — у меня есть похожие варианты в других локациях, если интересно, могу сравнить в одном сообщении.»\n\n### 8. «Не инвестирую / рынок не тот»\n*Уважать позицию, но мягко проверить, это про рынок в целом или про момент — и держать лёгкий контакт без давления.*\n\n1. **Без давления, контекст.** «Понимаю, решение всегда ваше. Просто для контекста — даже без покупки сейчас полезно понимать, что происходит на рынке, могу присылать раз в квартал короткую сводку без звонков.»\n2. **Про «не тот» рынок.** «Соглашусь, что в целом рынок неоднородный, но именно элитный сегмент центра почти не падает в цене — это другая логика, чем у массового жилья.»\n3. **Уважение позиции.** «Понял вас, это разумная позиция в текущей ситуации. Не буду спорить — оставлю контакт на случай, если позиция изменится.»\n4. **Долгосрочный горизонт.** «Хорошо, а если смотреть не на сейчас, а на горизонт в 2-3 года — рассматривали бы вообще такой актив как часть портфеля?»\n5. **Квалифицирующий вопрос.** «Понимаю. Просто уточню — вопрос в самой недвижимости как активе, или именно в моменте сейчас?»\n\n### 9. «Перезвоните позже» / «сейчас неудобно»\n*Не путать с отказом — закрепить конкретное время, иначе звонок просто потеряется во времени.*\n\n1. **Закрепление времени.** «Конечно, когда вам удобнее — сегодня вечером или завтра в первой половине дня?»\n2. **Письменная альтернатива.** «Хорошо, пришлю короткое сообщение, чтобы у вас было время прочитать, когда будет удобно, и тогда перезвоню.»\n3. **Уважение времени.** «Понимаю, не буду занимать время сейчас. Подскажите день и время, чтобы я не звонил не вовремя ещё раз.»\n4. **Якорь перед следующим звонком.** «Без проблем. Только одна фраза, чтобы вы знали, о чём пойдёт речь при следующем звонке: [короткое УТП]. Когда вам перезвонить?»\n5. **Финальная попытка после повторов.** «Понимаю, что момент неудачный уже несколько раз — последний раз уточню удобное время, и если не получится, больше не буду звонить, только напишу при действительно стоящем предложении.»\n\n### 10. «Я подумаю» / «дайте мне время»\n*Нормальная реакция на серьёзное решение — задача не торопить, а дать структуру для раздумий и зацепиться за конкретный срок.*\n\n1. **Конкретный срок.** «Конечно, время разумная вещь. Подскажите, сколько вам нужно, чтобы я вернулся не раньше и не позже — неделя, две?»\n2. **Что мешает решить.** «Хорошо. Можно спросить, что именно нужно обдумать — цену, формат, или просто пока рано?»\n3. **Снижение риска решения.** «Понимаю, торопиться точно не нужно. Параллельно пришлю материалы, чтобы было с чем думать, а не на словах.»\n4. **Честность про срок предложения.** «Принимаю. Просто будьте в курсе — у конкретного предложения есть срок актуальности цены, подскажу, если он будет подходить к концу, чтобы вы успели решить осознанно.»\n5. **Мягкое закрытие без давления.** «Хорошо, не тороплю. Жду от вас, или сам напомню через пару недель — как вам удобнее?»\n\n\n**«Без комиссии, только напрямую»** (📌 комиссию всегда платит собственник):\n1. «Понимаю. Комиссия — это стоимость покупателя: сегодня он стоит 4%. Давайте я сначала покажу, какой покупатель у меня есть, а условия обсудим при встрече. Когда удобно?»\n2. «Вы платите не за меня, а за человека с деньгами, который купит вашу квартиру. Если я его не приведу, вы ничего не платите. Показывать вам такого покупателя?»\n\n## Связанные темы\n- [Скрипт переписки с собственником](#skript-perepiski-s-sobstvennikom)\n- [Кросс-продажи](#kross-prodazhi)", "q": ["Что ответить на «откуда у вас мой номер»?", "…«не продаю»?", "…«сколько стоит моя квартира»?", "…«работаю с другим агентом»?", "…«какой покупатель? дайте конкретику»?", "…«без комиссии, только напрямую»?", "…«у меня есть свой брокер, он всё присылает»?", "…грубость, «не пишите мне»?"]}, "skript-zvonka-sobstvenniku": {"t": "Скрипт: звонок собственнику (ЦИАН / база ЖК)", "n": "Скрипт", "sec": "05-scripts", "md": "**Цель разговора:** встреча с собственником. Запасная цель — договорённость о следующем звонке.\n**Когда использовать:** звонок по объявлению на ЦИАНе или по базе собственников своего ЖК.\n\n## Официальный скрипт (регламент компании)\nОсновной скрипт не менялся годами. Его учат наизусть и отрабатывают каждый день с 9:00 до 10:00.\n\n1. «Здравствуйте, звоню по поводу продажи квартиры (адрес). Продаётся?»\n2. «Скажите, пожалуйста, вы собственник?»\n3. «Давайте я представлюсь: меня зовут ___, агентство недвижимости ЭстейтЛига. Как могу к вам обращаться?»\n4. «(Имя), очень приятно. Я работаю по району / ЖК ___, меня заинтересовала ваша квартира, хочу уточнить информацию».\n   *Возражение «не работаю с агентами, сам продаю»:* «Вас, наверное, покупатель интересует? Давайте объясню» — и сразу к п. 7.\n5. «Цена в объявлении сейчас актуальна?»\n6. «У вас свободная продажа или покупаете что-то взамен?»\n7. «(Имя), я работаю по району ___, сейчас продаю здесь (кол-во) квартир. После просмотров покупатели спрашивают, есть ли ещё квартиры в этом районе. Могу ли я предлагать вашу квартиру своим покупателям?»\n   *Возражение про комиссию — отработка.*\n8. «Отлично! Тогда я хотел бы встретиться, чтобы ознакомиться с объектом. Я каждый день в этом районе, у меня показы, встречи. Сегодня в 7 или в 8 вечера вам удобно?»\n   *Возражение «приходите с покупателем» — отработка.*\n9. «За час до встречи я позвоню, чтобы подтвердить».\n\n⚠️ Пункт 7 говори честно. Если своих объектов в районе нет, говори от лица компании: «у нас в компании здесь продаются квартиры» (см. Почему уходят стажёры).\n\nВстречу назначаем именно с собственником, тем, кто решает и платит комиссию, а не с представителем.\n\n---\n\nНиже — расширенная версия наставника с квалификацией и тремя договорённостями.\n\n## Структура\n1. Приветствие и имя\n2. Вопрос по документам\n3. Польза: почему звоню\n4. Квалификация\n5. Три простые договорённости\n6. Возражения\n7. Встреча с выбором времени\n8. Закрытие и запись в CRM\n\n## Текст\n**Агент:** Добрый день, я по квартире на [улица / ЖК], она ещё в продаже?\n**Клиент:** Да.\n**Агент:** Как могу к вам обращаться? … Очень приятно, меня зовут [имя]. Хотел уточнить ситуацию по документам: что по правоустановке? Больше пяти лет в собственности? Обременений нет?\n**Клиент:** …\n**Агент:** Я работаю по вашему району, у наших агентов продаются квартиры рядом, покупатели спрашивают, что ещё можно предложить. Могу ли предлагать им вашу квартиру и приводить к вам?\n*(Если у тебя есть свои объекты рядом: «У меня продаются соседние квартиры, покупатели спрашивают, что ещё есть рядом».)*\n**Агент:** Подскажите, у вас свободная продажа или альтернатива? … В какие сроки планируете выйти на сделку? … Почему решили продавать, что покупаете взамен? … Как определяли цену? … Какой торг закладывали? … Сколько показов в неделю, какая обратная связь? … Решение принимаете вы?\n**Агент:** Ситуацию понял. Чтобы приводить к вам покупателей, нам нужно достичь трёх простых договорённостей: как показывать, презентация и комиссия. Как вы показываете квартиру, живёте там или подъезжаете?\n… *(показы → «мне нужна минимальная причастность к вашему объекту в виде презентации на ЦИАНе» → «сегодня покупатель на рынке стоит 4%»)*\n**Агент:** Такие решения не принимаются по телефону. Давайте сегодня встретимся, в 7 или в 8 будет удобно?\n**Если встречи нет:** Давайте будем на связи, наберу через несколько дней, узнаю, как продвигается. *(Сразу комментарий и дата следующего касания в CRM.)*\n\n## Развилки и возражения\n| Клиент говорит | Отвечаем |\n|---|---|\n| «Не даю рекламу» | «Как моя реклама помешает продаже вашей квартиры? У нас одна цель — продать, так?» |\n| «Приходите с покупателем» | «У вас уже были агенты, которые сразу соглашались прийти с покупателем? К чему это привело?» |\n| «Не плачу комиссию» | «Вы платите не за бейджик агента, а за покупателя, который отдаст вам 30 миллионов. Покупатель на рынке стоит 4%» |\n| «Зачем вам эта информация?» | «Покупатели всегда спрашивают, зачем собственник продаёт. Когда есть понятный ответ, у них нет лишних подозрений» |\n| «Перезвоните через месяц» | «А что произойдёт через месяц, что мой звонок станет вам интересен?» |\n\nПолный список: [Возражения собственника](#vozrazheniya-sobstvennika).\n\n## Почему это работает\n- Вопрос по документам — лёгкий старт: собственнику просто отвечать, и завязывается диалог.\n- Польза в первой фразе отличает тебя от колл-центра.\n- «Три простые договорённости» превращают просьбу в понятную процедуру.\n- Выбор времени («в 7 или в 8») вместо «удобно ли вам встретиться».", "q": []}, "skript-perepiski-s-sobstvennikom": {"t": "Скрипт: первое сообщение собственнику и цепочка касаний", "n": "Скрипт", "sec": "05-scripts", "md": "**Цель:** получить ответ и начать диалог. Не продажа в первом сообщении.\n**Когда использовать:** собственники по базе своего ЖК, мессенджер. Пример написан под ЖК Hide, подставь свой дом.\n\n**Правила:** первое сообщение до 350 знаков, на «вы», спокойно, по-человечески. Один простой вопрос в конце. Без «уникальное предложение», «эксклюзив», «не упустите».
