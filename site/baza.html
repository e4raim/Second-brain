 Не выдумывать покупателей и цифры. Не слать одинаковый текст всем с одного номера (мессенджеры блокируют массовые рассылки): чередуй варианты.\n\n## Блок 1. Первое сообщение (5 вариантов)\n**1. Покупатель** — всем, самый рабочий заход.\n> Здравствуйте! Занимаюсь квартирами в Хайде, работаю с покупателями по дому. Сейчас ищут как раз такой метраж, как у вас. Подскажите, пожалуйста, вы квартиру продавать не думаете? Если нет — так и скажите, не буду больше беспокоить.\n> [Имя], Estateliga\n\n**2. Цены** — инвесторам, тем, кто считает деньги.\n> Здравствуйте! Я риелтор, веду дом — смотрю все сделки в Хайде. Цены за последнее время подросли, многие собственники этого ещё не знают и продают дешевле, чем могли бы. Подскажите, у вас квартира для себя или как вложение?\n\n**3. Арендатор** — пустым квартирам и тем, кто сдаёт сам.\n> Здравствуйте! Я по Хайду. Обратились люди, ищут квартиру вашего метража в аренду, надолго. Подскажите, ваша сейчас сдаётся или занята?\n\n**4. Коротко** — занятым, отвечают чаще всего.\n> Здравствуйте! Подскажите, пожалуйста, по вашей квартире в Хайде — продаёте, сдаёте или живёте сами?\n\n**5. Оценка** — тем, кто не решил, и тем, кому надоели агенты.\n> Здравствуйте! Я риелтор, специализируюсь на Хайде — знаю, за сколько квартиры в доме реально уходят, а не за сколько их выставляют. Если интересно, могу посчитать вашу, это бесплатно и ни к чему не обязывает. Посчитать?\n\n## Блок 2. Если молчит\n**Через 3 дня:**\n> Добавлю пару слов. Дом уже заселился, покупатель пошёл другой, и сделки сейчас закрываются дороже, чем год назад. У людей в голове часто сидит старая цена, поэтому и продают дешевле, чем стоило бы. Если хотите, посчитаю вашу квартиру по-честному.\n\n**Через неделю:**\n> Ещё момент. В вашей башне сейчас продаётся несколько квартир примерно такого же метража. Тут обычно побеждает не тот, кто сбросил цену, а кто нормально подготовился — фото, документы, адекватная цена. Показать, кто у вас в соседях по продаже?\n\n**Через две недели:**\n> По спросу: люди идут именно в Хайд, а не «посмотреть что-нибудь в районе». Дом узнаваемый, запросы приходят постоянно. Если надумаете продавать — покажу вашу квартиру своим покупателям ещё до того, как она появится в рекламе. Напомнить о себе попозже?\n\n**Через три недели, последнее:**\n> Не буду больше вас дёргать. Просто оставлю контакт: я по Хайду работаю постоянно и вижу все сделки в доме. Понадобится цена, покупатель или арендатор — напишите в любой момент, помогу. Всего доброго!\n\n## Блок 3. Ответы на реакции\nСм. [Возражения в переписке](#vozrazheniya-pri-zvonke-na-pokupku).\n\n## Почему это работает\n- Повод вместо просьбы: покупатель, цены, арендатор, оценка.\n- Лёгкий вопрос, на который можно ответить одним словом.\n- Цепочка касаний с новыми поводами, а не «напоминаю о себе».\n- Прощальное сообщение оставляет дверь открытой.", "q": []}, "skript-kross-prodazhi": {"t": "Скрипт: звонки собственникам элитных ЖК (продажа и кросс-продажа)", "n": "Скрипт", "sec": "05-scripts", "md": "**Цель:** короткий разговор, который заканчивается конкретным шагом (переписка, презентация, оценка).\n**Когда использовать:** база собственников делюкс-ЖК. 📌 Автор использует эти скрипты дословно.\n\n⚠️ Факты о проектах на июнь 2026, перед звонком проверь актуальность.\n\n## Скелет: звонок «на продажу»\n**1. Заход (5–7 сек):**\n> [Имя], добрый день. Я работаю по [ЖК], у меня сейчас покупатель смотрит именно вашу секцию / этаж. Звоню узнать: рассматриваете продажу в принципе или пока нет?\n\n**2. «Нет» / «не думал»:**\n> Понял. Просто ориентир: сейчас в [ЖК] сделки идут по [цена/м²], выше прошлого года на [Х]%. Если что, у вас есть мой контакт, на случай если решите прощупать рынок. Спасибо, что подняли трубку.\n\n**3. «Возможно» / «а что предлагаете»:**\n> У меня сейчас спрос именно на [тип объекта] в вашем доме. Могу за день дать ориентир по цене с учётом текущих сделок в комплексе. Удобно скинуть в Telegram или WhatsApp?\n\n**4. Закрытие:**\n> Скину вам расклад по цене сегодня до вечера, посмотрите без обязательств.\n\n**ЖК на стройке (ДДУ):** заход через переуступку.\n> По вашему ДДУ в [ЖК] — у меня спрос на переуступку именно перед сдачей, пока не нужно платить за готовое. Интересно зафиксировать цену сейчас?\n\n## Скелет: звонок «на покупку» (кросс-продажа)\n**Заход:**\n> [Имя], добрый день. Звоню не по вашей квартире в [ЖК], повод другой. В [район] на днях стартовали продажи в новом клубном доме [проект]. Обращаюсь именно к собственникам [формат], потому что такие лоты на старте разбирают за пару недель. Есть 30 секунд?\n\n**«Да»:** два-три факта (камерность, архитектура, локация), цена старта и фишка (например, трейд-ин). «Прислать презентацию, посмотрите без обязательств?»\n**«Не интересно»:** «Понял, просто держу вас в курсе таких запусков. Вы в моей базе как раз тех, кому это может пригодиться через полгода-год».\n**Закрытие:** «Скину в Telegram презентацию и шахматку лотов сегодня. Посмотрите на свежую голову, если откликнется — обсудим бронь до подъёма цены».\n\n## Матрица кросс-продаж (8 пар)\n| Текущий ЖК владельца | Что предложить | Логика | Заход |\n|---|---|---|---|\n| Бродский (Vesper, Хамовники) | Vesper Кутузовский | Тот же застройщик | «Звоню как к клиенту Vesper: у них вышел новый квартал на Кутузовском. В курсе уже?» |\n| Б. Дмитровка IX (особняк у Большого театра) | Левенсон (Трёхпрудный 9/1, Патриаршие) | Тот же тип: реконструкция исторического дома | «У меня то, что обычно ищут владельцы особняков в центре: реконструкция доходного дома у Патриарших» |\n| Армани Каса (Якиманка) | Казачий (MR Group, 1-й Казачий пер.) | Камерность 79 резиденций, трейд-ин | «Звоню не по вашей квартире: на Якиманке стартовал новый клубный дом делюкс-класса» |\n| Б. Никитская 9/15 (усадьба) | Времена Года (Старомонетный 18) | Тот же психотип: историческая атмосфера | «У вас усадьба на Никитской, у меня похожий формат: клубный дом в Старомонетном» |\n| Хамовники 12 (ДДУ) | Саввинская 27 | Второй актив в том же районе | «У меня для вас второй такой же актив в Хамовниках, на Саввинской набережной, на старте продаж» |\n| Лаврушинский (Sminex) | Резиденция 1864 (Софийская наб.) | Апгрейд вида на Кремль | «У вас вид на Кремль из Лаврушинского, у меня — вид на Кремль через реку, прямо напротив» |\n| Никитский 6 (Арбат) | Le Dome (Соймоновский пр., Остоженка) | Соседний топ-район | «У меня клубный дом на Остоженке, у храма Христа Спасителя, для тех, кто смотрит топ-локации центра» |\n| Красный Октябрь (Берсеневская) | Balchug Viewpoint (Садовническая наб. 5) | Тот же остров, выше формат | «Вы на острове Балчуг, у меня там же новый комплекс особняков» |\n\n## Почему это работает\n- Без представления-анкеты элитный собственник не вешает трубку на втором слове.\n- Сразу факт (покупатель, цена, новость) показывает, что звонок не ради звонка.\n- Закрытый быстрый вопрос не тянет разговор.\n- Мягкий выход сохраняет контакт на будущее.", "q": []}, "kakim-byt-minus-odin": {"t": "Каким быть -1 и как выбирать своего +1", "n": "Каким быть -1 и как выбирать своего +1", "sec": "07-management", "md": "**Отвечает на вопросы:**\n- У кого учиться (как выбрать своего +1)?\n- Что значит быть надёжным подчинённым?\n- Почему важно окружение?\n\n**Коротко (Час менеджера, Никита Воронин, 29.09.2026):** хорошим -1 можно быть, только когда у тебя есть +1. Деньги даются за риск и терпение: долго бить в одну точку и не останавливаться. Настроение — детская история, его не учитываем как фактор.\n\n## Три фактора своего +1\n1. Ты принял решение у него учиться.\n2. Тебе нравятся его результаты: у него есть то, чего ты хочешь.\n3. Ты готов учиться у него не только прикладному, но и жизни.\n\nНет этих трёх — не делаем стратегическую ставку на этого человека.\n\n## Каким быть -1\n- **Твёрдым и надёжным.** Мера надёжности: готов ставить общие цели выше личных.\n- **Обеспечить спокойствие +1** за свою зону, не скрывая, что происходит. Информацию давать чётко, давать себя разоблачать.\n- **Самомотивированным, с твёрдой психикой.** На тебя не надо тратить много внимания. Не быть проблемой.\n- **Учиться и не саботировать.** Настоящее обучение — когда позволяешь +1 менять твою логику принятия решений. Вырастут только те, кто позволяет себя менять.\n- **Мыслить как +1, даже когда он не рядом.**\n- **Благодарным и с чувством долга:** помнить, что все результаты нам дали. Помнить и плохое, чтобы делать ретроспективу.\n- **Не быть узким горлышком:** передавать знания дальше и беречь фокус +1.\n\n## Окружение\nЕдинственное, на что мы реально влияем, — с кем мы общаемся. Учимся и меняемся только через общение. С токсичным окружением расти невозможно: начинаешь принимать решения, как оно. Окружение отбирать так же жёстко, как людей в отдел.\n\n## Мозги\nМозг 1 — реактивный, на нём 99% решений. Мозг 2 — аналитический. Управленческая выносливость — думать мозгом 2. Люди, с которыми советуешься, помогают в этом.\n\n**Если у человека не меняются реакции, он не растёт,** сколько бы ни учился. Смотри на это у своих -1: не на слова, а на изменились ли реакции.\n\nМинимальный горизонт планирования — 10 лет. Признак неэффективных людей — они сильно себя продают.\n\n## Связанные темы\n- Раздваивание и отбор", "q": ["У кого учиться (как выбрать своего +1)?", "Что значит быть надёжным подчинённым?", "Почему важно окружение?"]}, "strah-i-otkazy": {"t": "Страх звонить и как переживать отказы", "n": "Страх звонить и как переживать отказы", "sec": "08-self-management", "md": "**Отвечает на вопросы:**\n- Мне страшно звонить. Что делать?\n- Как не расстраиваться из-за отказов?\n- У меня в голове каша и я не знаю, что сказать. Как учиться?\n\n**Коротко:** отказ не лично тебе. Отказы — это опыт, и результат на старте решает количество попыток. Первое время читай скрипт с листа, это нормально. Паузы на старте тоже нормальны, как у ребёнка, который учится говорить: буквы, слоги, слова.\n\n## Главное\n- **Отказ не лично тебе.** Стажёры теряли энергию, потому что принимали каждое «нет» на свой счёт.\n- **Ни один чемпион не выиграл с первой попытки.** Даже Карлсен иногда проигрывает. Плохо проведённая встреча — всё равно твоя первая встреча.\n- **Холст:** каждый звонок — точка на белом холсте. После тысячи звонков пустых мест нет.\n- **Не думай долго, звони.** Чем дольше решаешь «позвонить или нет», тем быстрее выдыхаешься.\n- **Перебивает и хамит — звони следующему,** не зацикливайся.\n- **Уверенность важнее скорости.** Лучше сказать уверенно и помолчать 10 секунд, чем дрожать голосом.\n- **Ты не обманываешь и не лезешь не в своё дело.** Ты звонишь с пользой: у компании есть покупатели, ты можешь привести их к собственнику. Если своих объектов рядом нет, говори от лица компании.\n\n## Как учиться\n- Первое время читай скрипт с листа, потом он запомнится.\n- Вечером прогоняй сегодняшние диалоги: «вот тут мне сказали это, а надо было ответить так».\n- Запись на диктофон имеет смысл, только если переслушать и выписать. Записал и не слушал — это для галочки.\n- Задание на вечер: по 5 отработок на каждое главное возражение, утром разбор с наставником.\n- Портал компании: лекции руководителей (набор объектов, работа с собственником, встреча, возражения) и выступления Димитриадиса.\n\n## Связанные темы\n- [Дожим и закрытие](#dozhim-i-zakrytie)\n- [Возражения собственника](#vozrazheniya-sobstvennika)", "q": ["Мне страшно звонить. Что делать?", "Как не расстраиваться из-за отказов?", "У меня в голове каша и я не знаю, что сказать. Как учиться?"]}, "plan-dnya": {"t": "План дня и как разгрести завалы", "n": "План дня и как разгрести завалы", "sec": "08-self-management", "md": "**Отвечает на вопросы:**\n- Как спланировать рабочий день агента?\n- У меня 150+ просроченных звонков. С чего начать?\n- Как не распыляться в течение дня?\n\n**Коротко:** быстрые задачи закрываешь в начале дня, запланированные звонки ставишь первым большим блоком, просрочку разбиваешь на партии по 40–50 и бьёшь блоками. Объекты не ищешь отдельно, они появляются из основного потока звонков. Задачи на завтра ставишь с вечера.\n\n## Пример плана дня (10:00–20:00, когда накопились завалы)\n| Время | Блок |\n|---|---|\n| 10:00–10:15 | Быстрая задача (например, снизить цену по двум объектам), чтобы не тащить её весь день |\n| 10:15–11:45 | Запланированные звонки (50) — твёрдые обязательства, пока голова свежая |\n| 11:45–13:15 | Просрочка, блок 1 (~50) |\n| 13:15–14:15 | Обед |\n| 14:15–15:30 | Вычисления, блок 1 (~40) |\n| 15:30–17:00 | Просрочка, блок 2 (~50) |\n| 17:00–17:15 | Пауза |\n| 17:15–18:30 | Вычисления, блок 2 (~40) |\n| 18:30–19:30 | Просрочка, блок 3 |\n| 19:30–20:00 | Итог дня: выписать перспективные контакты под новые объекты, перенести остаток |\n\n## Правила\n- **Вычисления — топливо для звонков.** Без них нет новых лидов, не откладывай их «на потом».\n- **Просрочка горит:** каждый день протухания снижает конверсию. Но за один день 168 звонков не закрыть, нужно два.\n- **Одно дело за раз.** Агент одновременно пишет одному, звонит другому, болтает с третьим, а потом удивляется, что ничего не сделано.\n- Задачи и отчёт ставить с вечера. Работать в одно и то же время. Не залипать в соцсетях.\n- Каждое утро — отработка диалогов. Наставник делает это каждое утро уже два года.\n\n## Связанные темы\n- [График и нормы](#grafik-i-normy)\n- [Страх и отказы](#strah-i-otkazy)", "q": ["Как спланировать рабочий день агента?", "У меня 150+ просроченных звонков. С чего начать?", "Как не распыляться в течение дня?"]}, "otdyh-i-vosstanovlenie": {"t": "Отдых и восстановление управленца и агента", "n": "Отдых и восстановление управленца и агента", "sec": "08-self-management", "md": "**Отвечает на вопросы:**\n- Как правильно отдыхать, чтобы был результат?\n- Почему отдых должен быть скучным?\n- Что делать с тревожностью?\n- Как высыпаться?\n\n**Коротко (Час менеджера, Никита Воронин, 11.08.2026):** управление — тяжёлый интеллектуальный спорт: каждый день много важных решений. Продукт управленца — решение, а решение делает ЦНС. Значит, отдых — часть продукта. Отдыхать должны и тело, и нервная система, а нервная система отдыхает, когда скучно.\n\n## Главное\n- **Гиперкомпенсация, как в пауэрлифтинге.** Тренируешься часто с короткими перерывами — результат падает. Даёшь восстановиться при том же объёме — результат растёт. Спортсмены соревнуются и в том, кто лучше восстанавливается.\n- **Тело:** покой, минимум активности, массаж.\n- **ЦНС:** скука и покой. Никаких «приключений и эмоций», иначе ЦНС не расслабится. Скуку нужно тренировать.\n- **Индикатор,** что человек отдохнул: «живчик», смотрит свежо и ясно, как глазами ребёнка.\n\n## Сон и питание\nПравильное питание. Сон: тёмная прохладная комната, нормальный матрас, без телефона и ТВ за час до сна, без тяжёлой еды на ночь, ложиться и вставать рано. Дыхание для засыпания: 4 счёта вдох, 7 задержка, 8 выдох.\n\n## Тревожность и самоконтроль\n- У талантливых людей сильная тревожность — это плата за высокую чувствительность. Чем больше развиваешься, тем её больше.\n- Без самоконтроля человек легко загорается и быстро выгорает. Самоконтроль — умение включать чувствительность как по кнопке: включил, решил вопрос, выключил.\n- Фокус — энергия ЦНС, её нельзя выжигать.\n\n## Гигиена\n- Информационная и ментальная гигиена: никакого токсичного окружения, меньше информационного шума.\n- Пустота всегда заполнится, поэтому заполняй её осмысленным (книги), а не лентой.\n- Антидепрессанты — энергия, взятая под огромный процент.\n\n## 📌 Инсайт автора\nПродукт управленца — решение, его качество зависит от восстановления ЦНС, значит, отдых — часть продукта. Мы живём в постоянном шуме, а у людей с высокой чувствительностью входящего сигнала больше, отсюда тревожность и раздражительность. Но эта же чувствительность делает нас хорошими управленцами: раньше видишь проблему, тоньше чувствуешь сделку и команду. Отдых превращает чувствительность из уязвимости в оружие. Без него мы черпаем решения из резерва, который не успевает наполниться.\n\n**Практика:** каждый день 20–30 минут тишины без музыки и телефона (прогулка, медитация). Это профилактика, а не экстренная мера при выгорании.\n\n## Связанные темы\n- [План дня](#plan-dnya)", "q": ["Как правильно отдыхать, чтобы был результат?", "Почему отдых должен быть скучным?", "Что делать с тревожностью?", "Как высыпаться?"]}}, "order": ["o-kompanii", "dengi-agenta", "grafik-i-normy", "crm-i-rasporyadok-dnya", "rynok-osnovy", "segment-i-klient", "rabota-po-odnomu-zhk", "kommercheskaya-nedvizhimost", "put-sdelki", "istochniki-obektov", "zvonok-sobstvenniku", "tri-dogovorennosti", "vstrecha-s-sobstvennikom", "obekt-v-praise", "podgotovka-obekta-k-pokazu", "pokupateli-i-pokaz", "cena-i-snizhenie", "rabota-na-perspektivu", "strategii-prodazhi-obekta", "obyavlenie-i-foto", "kommentarii-v-crm", "dozhim-i-zakrytie", "yuridicheskaya-baza", "kross-prodazhi", "vozrazheniya-sobstvennika", "vozrazheniya-pri-zvonke-na-pokupku", "skript-zvonka-sobstvenniku", "skript-perepiski-s-sobstvennikom", "skript-kross-prodazhi", "kakim-byt-minus-odin", "strah-i-otkazy", "plan-dnya", "otdyh-i-vosstanovlenie"], "sections": {"01-company": "Компания", "02-product": "Продукт и ЖК", "03-sales": "Продажи", "04-objections": "Возражения", "05-scripts": "Скрипты", "06-dialog-reviews": "Разборы", "07-management": "Рост и мышление", "08-self-management": "Личная эффективность"}, "tracks": {"intern": {"t": "Трек: Стажёр", "md": "**Для кого:** новичок, первые 2–4 недели.\n**Результат прохождения:** понимает компанию и продукт, знает структуру звонка и три главных возражения, набирает первые объекты.\n\n> **Цель первой недели:** 2–3 встречи в день и 4 объекта с открытых источников (ЦИАН, Авито) за неделю. После 4 объектов — CRM, лиды компании и работа по своему ЖК.\n>\n> Сначала звонки, потом теория. Юридика и деньги со второй недели. Не знаешь, куда смотреть, — открой [FAQ](#home).\n\n## День 1 — компания и логика звонка\n- [ ] [Компания: кто мы, сегмент, инструменты](#o-kompanii)\n- [ ] [Основы рынка: первичка, вторичка, апартаменты](#rynok-osnovy)\n- [ ] [Путь сделки: 6 этапов и продукт кажд const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => (window.marked ? marked.parse(s, {gfm:true}) : "<pre>"+esc(s)+"</pre>");

function buildNav(active){
  let h = `<h4>Начало</h4><a href="#home" class="${active==="home"?"on":""}">Вопросы и ответы</a>
    <a href="#track-intern" class="${active==="track-intern"?"on":""}">Трек стажёра</a>
    <a href="#track-agent" class="${active==="track-agent"?"on":""}">Трек агента</a>`;
  let sec = null;
  for (const slug of DATA.order){
    const d = DATA.docs[slug];
    if (d.sec !== sec){ sec = d.sec; h += `<h4>${esc(DATA.sections[sec]||sec)}</h4>`; }
    h += `<a href="#${slug}" class="${active===slug?"on":""}">${esc(d.n||d.t)}</a>`;
  }
  $("#toc").innerHTML = h;
}
function wrapTables(el){ el.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tbl";t.parentNode.insertBefore(w,t);w.appendChild(t);}); }

function faqList(groups){
  if (!groups.length) return `<p class="empty">Ничего не нашлось. Попробуй другое слово или спроси наставника.</p>`;
  return groups.map(g=>`<h2>${esc(g.h)}</h2><ul>${g.items.map(i=>
    `<li><a href="#${i.to}"><span class="q">${esc(i.q)}</span><span class="to">${esc(i.names.join(" · "))}</span></a></li>`).join("")}</ul>`).join("");
}
function home(){
  return `<div class="crumb">Для стажёров и агентов</div>
  <h1>Есть вопрос? Ответ здесь</h1>
  <p class="lead">Найди свой вопрос в списке или через поиск сверху. Не нашёл ответа — спроси наставника, и вопрос добавят.</p>
  <div class="roles">
    <a class="role" href="#track-intern"><b>Я стажёр</b><span>Программа по дням: от первого звонка до своего ЖК</span></a>
    <a class="role" href="#track-agent"><b>Я агент</b><span>Весь цикл сделки, удержание собственника, сложные разговоры</span></a>
  </div>
  <div class="faq">${faqList(DATA.faq)}</div>`;
}
function search(term){
  const t = term.toLowerCase().trim();
  const groups = DATA.faq.map(g=>({h:g.h, items:g.items.filter(i=>i.q.toLowerCase().includes(t))})).filter(g=>g.items.length);
  const topics = DATA.order.filter(s=>{const d=DATA.docs[s]; return d.t.toLowerCase().includes(t)||d.md.toLowerCase().includes(t);});
  const tl = topics.length ? `<h2>Темы, где это упоминается</h2><ul>${topics.map(s=>`<li><a href="#${s}"><span class="q">${esc(DATA.docs[s].t)}</span><span class="to">${esc(DATA.sections[DATA.docs[s].sec]||"")}</span></a></li>`).join("")}</ul>` : "";
  $("#main").innerHTML = `<div class="crumb">Поиск</div><h1>«${esc(term)}»</h1><div class="faq">${groups.length?faqList(groups):""}${tl||(!groups.length?faqList([]):"")}</div>`;
}

function render(){
  const id = (location.hash||"#home").slice(1) || "home";
  const main = $("#main");
  if (DATA.docs[id]){
    const d = DATA.docs[id], i = DATA.order.indexOf(id), nx = DATA.order[i+1];
    main.innerHTML = `<div class="crumb">${esc(DATA.sections[d.sec]||"")}</div><h1>${esc(d.t)}</h1><article>${md(d.md)}</article>`+
      (nx?`<div class="next">Дальше: <a href="#${nx}">${esc(DATA.docs[nx].n||DATA.docs[nx].t)}</a></div>`:"");
  } else if (id.startsWith("track-") && DATA.tracks[id.slice(6)]){
    const tr = DATA.tracks[id.slice(6)];
    main.innerHTML = `<div class="crumb">Маршрут обучения</div><h1>${esc(tr.t)}</h1><article>${md(tr.md)}</article>`;
  } else { main.innerHTML = home(); }
  wrapTables(main);
  main.querySelectorAll('input[type=checkbox]').forEach(c=>c.disabled=false);
  buildNav(DATA.docs[id]||id.startsWith("track-")?id:"home");
  $("#toc").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>{ $("#q").value=""; render(); });
$("#q").addEventListener("input", e=>{ const v=e.target.value; v.trim().length>1 ? search(v) : render(); });
$("#menuBtn").addEventListener("click", ()=>{ const n=$("#toc"); const o=n.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(o)); });
render();
</script>
