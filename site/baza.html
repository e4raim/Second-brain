:root[data-theme="dark"]{

      padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 24px max(16px,env(safe-area-inset-left,0px));
      border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .2s ease}

}

const DATA = {"docs": {"o-kompanii": {"t": "Компания: кто мы, сегмент, инструменты", "n": "Компания", "sec": "01-company", "md": "**Отвечает на вопросы:**\n- Что за компания и чем мы занимаемся?\n- С какими клиентами и объектами работаем?\n- Какие инструменты компания даёт агенту?\n- Где переписываться с клиентами?\n\n**Коротко:** Эстейтлига (ООО «Мегаполис-Сервис Эстейтлига») — агентство недвижимости бизнес- и премиум-класса в Москве. Около 400 агентов, офис в Дубае, около 2000 объектов на ЦИАНе. Агент находит собственников и покупателей и доводит до задатка. Сделку дальше ведёт юрист компании.\n\n## Главное\n\n**Сегмент.** Бизнес и премиум: объекты от 20 млн ₽, квадратный метр 600–700 тыс. ₽. Клиенты — бизнесмены, медийные люди, блогеры, то есть люди, которые уже заработали капитал. Часто они вдвое старше агента. Первые полтора месяца уходят на то, чтобы научиться разговаривать с ними на равных.\n\n**Наш отдел — вторичка:** продажа и аренда квартир в ЖК бизнес- и премиум-класса (см. [Основы рынка](#rynok-osnovy)).\n\n**Направления компании:** вторичка и аренда в Москве, новостройки, коммерческая недвижимость, зарубежная недвижимость (Дубай). Первые деньги у новичка обычно приходят с аренды: цикл сделки короче.\n\n**Формат работы.** Агент сам выходит на собственников, поэтому возражений много. Работа офлайн: офис, показы, выезды. Удалёнки нет.\n\n## Инструменты компании\n\n| Инструмент | Что это | Когда к нему идти |\n|---|---|---|\n| CRM | База контактов, звонков, задач и объектов. Объект из CRM сам выгружается на площадки | Каждый звонок, каждый комментарий, каждая дата следующего касания |\n| Телефония и сим-карта | Рабочий номер, звонки записываются | С первого дня |\n| Аккаунт ЦИАНа | Рабочий аккаунт выдаёт компания, реклама оплачивается компанией | Когда объект взят в работу |\n| Юрист компании | Ведёт сделку после задатка, проверяет документы | Как только есть покупатель и задаток |\n| Лидогенерация | Входящие заявки от компании | Распределяются руководителем |\n| Передача клиентов коллегам | Клиента на Дубай или новостройку можно передать профильному коллеге | Когда запрос не твой профиль |\n| Портал обучения | «Мои обучения» → каталог: около 100 лекций руководителей, выступления Димитриадиса | Каждый день, особенно первые недели |\n| Чаты отдела | Оперативная связь | Каждый день |\n\n**Главное правило CRM:** если звонка нет в CRM, значит, его не было.\n\n## Безопасность переписки\n\nРабочая переписка ведётся только в корпоративном мессенджере (Rocket), а не в Телеграме. Это касается данных клиентов, базы и договорённостей, то есть всего, чем ты не сможешь управлять, если телефон окажется в чужих руках. Компания готовит личный кабинет агента, где клиент переписывается с компанией, а не с агентом в личке.\n\n## Связанные темы\n- [Деньги агента](#dengi-agenta)\n- [График, нормы и режим](#grafik-i-normy)\n- [Работа по одному ЖК](#rabota-po-odnomu-zhk)", "q": ["Что за компания и чем мы занимаемся?", "С какими клиентами и объектами работаем?", "Какие инструменты компания даёт агенту?", "Где переписываться с клиентами?"]}, "dengi-agenta": {"t": "Деньги агента: как считается доход", "n": "Деньги агента", "sec": "01-company", "md": "**Отвечает на вопросы:**\n- Сколько я получу со сделки?\n- Что такое «вал»?\n- Почему стажировка не оплачивается?\n- Кто платит за рекламу?\n\n**Коротко:** агент получает процент от вала, то есть от денег, которые он принёс в компанию, за вычетом рекламы. 📌 **Первые 4 сделки агента идут по ставке 20%, дальше от 25 до 40%** в зависимости от выплат. Оклада нет.\n\n## Пример расчёта\n\n| Шаг | Сумма, ₽ |\n|---|---|\n| Комиссия от клиента (вал) | 100 000 |\n| Реклама на ЦИАНе (около 3 000 в месяц) | −3 000 |\n| База для расчёта | 97 000 |\n| Агенту на руки (20%) | 19 400 |\n\n- Из своего кармана агент платит только свою долю рекламы (в примере 600 ₽), остальное оплачивает компания.\n- 20% — это чистыми. Юристы, офис, маркетинг и колл-центр агента не касаются.\n- Расходы на рекламу пишутся в CRM автоматически, отчётность агент не ведёт. Бухгалтерия распределяет деньги по сумме, которую принёс агент, независимо от процента комиссии.\n\n## Почему нет оплачиваемой стажировки\n\nКомпания вкладывает эти деньги в лидогенерацию и инструменты, чтобы агентам было легче зарабатывать.\n\n## Как говорить о деньгах с кандидатом\n\n- Честно: только процент, первые 1–3 месяца дохода может не быть.\n- Не обещать сроки первой сделки и не рассказывать «купил Porsche через год». Если рассказывать, то связкой «результат = объём работы»: «купил, потому что делал по X звонков в день».\n- Обязательно спросить, на сколько месяцев у человека хватит денег (подушка).\n\n## Связанные темы\n- Собеседование кандидата\n- [Компания](#o-kompanii)", "q": ["Сколько я получу со сделки?", "Что такое «вал»?", "Почему стажировка не оплачивается?", "Кто платит за рекламу?"]}, "grafik-i-normy": {"t": "График, нормы звонков и режим дня", "n": "График, нормы звонков и режим дня", "sec": "01-company", "md": "**Отвечает на вопросы:**\n- Какой у нас график?\n- Сколько нужно звонить в день?\n- Сколько объектов нужно держать в рекламе?\n- Что считается нормальным рабочим днём?\n\n**Коротко:** график 6/1, бывают вечерние показы. 📌 Норма: **минимум 350 минут разговора в неделю, цель — 500 минут**, это 100–200 звонков в день. Цель по объектам — **40 объектов в рекламе на ЦИАНе**. На старте результат решает количество попыток, а не раздумья.\n\n## График 6/1\n\nСуббота — рабочий день. Так быстрее выходишь на первую сделку: за 5–6 недель на 6/1 делаешь объём, на который на 5/2 ушло бы два месяца. Кандидатам об этом говорим сразу. Ответ «по ситуации» — это не «да».\n\n## Нормы (📌 утверждено автором)\n| Что | Норма |\n|---|---|\n| Минуты разговора в неделю | Минимум 350, цель 500 |\n| Звонков в день | 100–200 |\n| Объектов в рекламе на ЦИАНе | Стремимся к 40 |\n\n**Регламент компании** задаёт минимум 40 звонков в день и распорядок дня (см. [CRM и распорядок дня](#crm-i-rasporyadok-dnya)). **Цель первой недели стажёра** по программе наставника: 2–3 встречи в день и 4 объекта с открытых источников за неделю.\n\nЭта норма одна для всех и не меняется от разговора к разговору. Цифры, которые звучали раньше (50 звонков и 10 встреч в день, 100 объявлений ЦИАНа, 40 звонков в регламенте, 70–80 звонков на «Часе менеджера»), считаем устаревшими или частными ориентирами.\n\n## Почему объём важнее раздумий\n- **Холст.** Каждый звонок — точка на белом холсте. После тысячи звонков пустых мест не остаётся, и нет возражений, на которые нечего сказать.\n- **Ресурс решений.** Чем дольше думаешь «звонить или нет, что сказать», тем быстрее выдыхаешься.\n- **Блоки по 20 звонков.** Звони блоками, а не по одному с перерывами.\n\n## Типичные ошибки\n- Пропустить день. Ты не просто недоработал, ты не добавил снега в свой снежный ком (см. [Работа на перспективу](#rabota-na-perspektivu)).\n- Прятаться за встречу: «у меня сегодня встреча, звонить не буду».\n\n\n## Связанные темы\n- [План дня и разбор завалов](#plan-dnya)\n- [Страх звонить и отказы](#strah-i-otkazy)", "q": ["Какой у нас график?", "Сколько нужно звонить в день?", "Сколько объектов нужно держать в рекламе?", "Что считается нормальным рабочим днём?"]}, "crm-i-rasporyadok-dnya": {"t": "CRM, теги и распорядок рабочего дня по регламенту", "n": "CRM, теги и распорядок рабочего дня по регламенту", "sec": "01-company", "md": "**Отвечает на вопросы:**\n- С какого номера звонить клиентам?\n- Что обязательно сделать в CRM после звонка?\n- Какие бывают теги и зачем они?\n- Как работать с новыми лидами от колл-центра?\n- Как выглядит рабочий день агента по регламенту?\n\n**Коротко (регламент компании):** звонить только с корпоративной сим-карты. Каждый клиент — в CRM: имя, личный номер, карточка контакта, теги, комментарий, запланированный звонок. Новые лиды обрабатываются не позже 24 часов с момента поступления.\n\n## После каждого звонка\n- Комментарий в карточке.\n- Имя и личный номер клиента, карточка в списке контактов.\n- Теги.\n- Запланированный следующий звонок. Даже если не дозвонился — планируешь и перезваниваешь.\n\nПути в CRM:\n- Пикси: Недвижимость → Продажа/Аренда → Собственники → Детали → Улица/Метро/ЖК.\n- Сортировка по тегам: Контакты → Теги → «Теги вместе» (например, собственники конкретного ЖК).\n- Чек-лист по ЖК, чек-лист по сделке, видеообзор агентского договора: Обучение → Материалы.\n\n## Теги\nЖК (название) · Собственник · Покупатель · Аренда · Аренда спрос · Не договорился · Вычисления · Не дозвон · Подбор новостроек · Дубай · Инвестиция · Риелтор · Агент покупателя · Бывшие клиенты (после сделки). У клиента может быть несколько тегов.\n\n**Новый лид** — тег ставится автоматически для контактов от колл-центра, сам агент его не ставит.\n- Если с клиентом раньше никто из агентства не общался, звоним с «Термитов». Если ты уже созванивался с ним — можно с рабочего номера (это «старый-новый лид»).\n- Тег «Новый лид» убираешь сразу после контакта и ставишь нужные (Собственник, ЖК и т. д.).\n\n## Распорядок дня (регламент, «работа на перспективу»)\n| Время | Что |\n|---|---|\n| 08:45 | Приход |\n| 09:00–09:30 (до 10:00) | Отработка диалогов |\n| 09:30–09:50 | Проверка рекламы, 20 минут |\n| Основной блок (от 4 часов) | Жёлтая зона прайса (40 мин) → все новые лиды → запланированные звонки (1 час, просроченных не больше 10) → новые объекты в Пикси (30 мин) |\n| | Обед 30 минут |\n| | Тег «Не договорился» раз в три дня (30 мин) → вчерашние вычисления, 10 звонков (30 мин) |\n| После 15:00 | Старые лиды и чужие просроченные запланированные (60 мин), звонки риелторам на просмотры (2, если нет встреч и показов), тег «Покупатели» (60 мин), неактуальные лиды, вычисления от 10 в день (вечером, 1 час) |\n| | Выезды: от 2 встреч в день, или 2 показа, или 2 просмотра |\n| После 20:00 | Новые объекты в рекламу, добавить показы и покупателей |\n| До 00:00 | Задачи на следующий день — руководителю |\n| До 09:00 | Отчёт за предыдущий день |\n\nМинимум по регламенту — 40 звонков в день. Норма отдела выше: 350 минут в неделю минимум, цель 500 минут, 100–200 звонков в день (см. [График и нормы](#grafik-i-normy)).\n\n## Связанные темы\n- [Комментарий в CRM](#kommentarii-v-crm)\n- [Объект в прайсе: жёлтая и красная зоны](#obekt-v-praise)", "q": ["С какого номера звонить клиентам?", "Что обязательно сделать в CRM после звонка?", "Какие бывают теги и зачем они?", "Как работать с новыми лидами от колл-центра?", "Как выглядит рабочий день агента по регламенту?"]}, "rynok-osnovy": {"t": "Основы рынка: первичка и вторичка, квартира и апартаменты", "n": "Основы рынка", "sec": "02-product", "md": "**Отвечает на вопросы:**\n- Чем первичный рынок отличается от вторичного?\n- С каким рынком работает наш отдел?\n- Чем квартира отличается от апартаментов?\n- Что делать с клиентом на новостройку или Дубай?\n\n**Коротко:** наш отдел работает со вторичкой: продажа и аренда квартир в ЖК бизнес- и премиум-класса. Клиентов на новостройки передаём в отдел новостроек, на Дубай — в офис в Дубае, комиссию делим.\n\n## Первичный и вторичный рынок\n| | Первичный | Вторичный |\n|---|---|---|\n| Что это | Новостройки, у объекта ещё не было хозяина | Объекты, которые уже были в чьей-то собственности |\n| С кем работает агент | Ведёт покупателя к застройщику | С продавцом и с покупателем |\n| Особенность | Ипотечные программы, рассрочки, льготы | Готовый объект, документы, история собственности |\n\n## Жилая и коммерческая\n- **Жилая:** дома, квартиры, таунхаусы. Часто самый ценный актив человека.\n- **Коммерческая:** офисы, магазины, рестораны, склады, отели. Обычно сдаётся бизнесу (см. [Коммерческая недвижимость](#kommercheskaya-nedvizhimost)).\n\n## Квартира или апартаменты\n- Квартира — для постоянного проживания. Апартаменты по закону — нежилое помещение, чаще для аренды и инвестиций.\n- Апартаменты обычно дешевле на 15–30%, но по квартире доступны льготные программы, материнский капитал, налоговый вычет.\n- Апартаменты в центре и в комплексе с инфраструктурой приносят больше арендного дохода.\n- В своём ЖК знай, что именно там продаётся.\n\n## Немного истории\nАктивный рынок появился в 90-х вместе с частной собственностью. В СССР в квартирах жили, могли обменять, но не продать. Приватизация дала право продавать, дарить, завещать и сдавать. Около 30% выданных в СССР квартир так и не приватизированы.\n\n## Связанные темы\n- [Компания](#o-kompanii)\n- [Путь сделки](#put-sdelki)", "q": ["Чем первичный рынок отличается от вторичного?", "С каким рынком работает наш отдел?", "Чем квартира отличается от апартаментов?", "Что делать с клиентом на новостройку или Дубай?"]}, "segment-i-klient": {"t": "Наш клиент: как разговаривать с премиум-аудиторией", "n": "Наш клиент", "sec": "02-product", "md": "**Отвечает на вопросы:**\n- Кто наши клиенты?\n- Как разговаривать с человеком вдвое старше и богаче меня?\n- Какие типы собственников бывают и как с каждым говорить?\n\n**Коротко:** наши клиенты — люди с капиталом и без времени. Они мгновенно считывают давление, «колл-центр» и фальшь. С ними говорим коротко, по делу, на «вы», как сосед-профессионал. Собственник для нас бизнес-партнёр, покупатель — будущая сделка.\n\n## Главное\n- Разговор «на равных» не значит фамильярно. Значит уверенно, без заискивания и без оправданий.\n- Не продавай себя громкими словами. Признак неэффективного человека — он сильно себя продаёт. Твоя сила — знание дома и рынка.\n- Никакой лишней информации: каждая лишняя деталь — ещё один повод для возражения.\n\n## Четыре типа собственников (для переписки и звонков)\n\n| Тип | Тон | Что предлагать | Вопрос в конце |\n|---|---|---|---|\n| Живёт сам | Уважительно, как к соседу. Продажу не предлагать до 2–3 касания | Бесплатная оценка «просто знать цифру», статистика по дому | «Живёте или квартира под что-то другое?» |\n| Инвестор с несколькими объектами | Деловой, на цифрах | Покупатель с наличными, ротация «продать один лот, зайти в другой», налог при продаже до минимального срока владения | «Какая цифра вам интересна для выхода?» |\n| Пустая квартира | Прямой, через упущенную выгоду, без давления | Продажа или аренда, пусть выберет сам. Аренда заходит легче | «Продавать или сдать — что ближе?» |\n| Сдаёт в аренду | Как с коллегой по бизнесу. Текущего арендатора не трогать | Подстраховка на момент освобождения, расчёт «продать сейчас или держать» | «До какого месяца договор?» |\n\n## Покупатели\n- Выстраивай лояльность, не навязывайся, показывай экспертность.\n- Помогай, а не «дожимай». Покупатели — это деньги и результат, их нужно ценить.\n\n## Связанные темы\n- [Кросс-продажи собственникам элитных ЖК](#kross-prodazhi)\n- [Первое касание в мессенджере](#skript-perepiski-s-sobstvennikom)", "q": ["Кто наши клиенты?", "Как разговаривать с человеком вдвое старше и богаче меня?", "Какие типы собственников бывают и как с каждым говорить?"]}, "rabota-po-odnomu-zhk": {"t": "Работа по одному ЖК: как стать экспертом дома", "n": "Работа по одному ЖК", "sec": "02-product", "md": "**Отвечает на вопросы:**\n- Почему мы работаем в одном ЖК, а не по всей Москве?\n- Что нужно знать про свой ЖК?\n- Как понять, что я «выучил» ЖК?\n- Когда стажёр начинает работать по ЖК?\n- Что такое «монополия в ЖК»?\n\n**Коротко:** новичок работает в одном ЖК. Так ты знаешь каждую планировку, цену, собственника и соседей и быстрее становишься экспертом, чем если распыляться по всему городу. Цель — монополия: большая часть объектов дома продаётся через тебя.\n\n## Когда начинать работу по ЖК\nПо регламенту стажёр начинает работу по ЖК **после 4 подписанных листингов** (объектов с открытых источников — ЦИАН, Авито). До первого звонка по ЖК он заполняет чек-лист по комплексу, ориентируется в ценах по ЦИАНу и узнаёт у руководителя историю сделок по ЖК.\n\n## Чек-лист по ЖК (заполнить до первых звонков)\nВсё, что в нём есть, ты говоришь собственнику без подсказки. Шаблон в CRM: Обучение → Материалы.\n1. **Паспорт комплекса:** название, адрес, метро и время пешком; застройщик, год сдачи; класс; корпуса, этажность, число квартир; паркинг и цена машино-места; охрана, консьерж, закрытая территория; инфраструктура внутри; что рядом (школы, сады, парки, ТЦ).\n2. **Планировки и цены:** по каждому типу (студия, 1-, 2-, 3-комн., 4+ и пентхаус) — площадь, цена продажи от–до, цена за м², аренда в месяц. Все планировки разобраны: какая где, на какие стороны окна. Цены сверены по ЦИАНу. Знаешь состояние квартир: без отделки, white box, с ремонтом.\n3. **История и рынок:** история сделок по ЖК от руководителя (что, почём, за какой срок); сколько объектов в рекламе и у кого; шахматка или таблица всех объектов в рекламе — каждый знаешь в лицо; 3 главных плюса и 2 минуса комплекса и как отвечать на минусы; 2–3 ближайших конкурента и чем наш лучше или хуже.\n4. **Проверка себя:** рассказать про комплекс за 1 минуту так, как собственнику (где, что, почём, кто покупает и почему сейчас); без бумажки назвать цену за м² по каждому типу; ответить на «почему так дорого/дёшево»; наставник принял рассказ.\n\n## Первые шаги в комплексе (регламент «Работа по ЖК»)\n1. Чек-лист по комплексу: все планировки и цены на продажу и аренду.\n2. Обзвонить Пикси за весь период по продаже и аренде, назначить первые встречи.\n3. Съездить на 2–3 просмотра с другими агентами.\n4. Познакомиться с консьержами, пообщаться с 3–4 жильцами.\n5. Подписаться на все чаты комплекса и обновления ЦИАНа.\n6. Обзвонить контакты с тегом «Собственник», особенно старые лиды.\n7. Раскидать буклеты.\n8. Новые лиды от колл-центра обрабатывать в течение 24 часов.\n9. Вычисления: шахматка или таблица всех объектов в рекламе.\n10. Обзвонить покупателей ЖК по тегу «Покупатель»: может, хотят купить ещё, продать или сдать.\n\nПеред встречей в ЖК полезно посмотреть 15 минут видео про проект и локацию.\n\n## Как продавать в своём ЖК (реализация)\n- Определить самый ликвидный метраж в ЖК: какие площади пользуются спросом.\n- Стремиться к монополии в ЖК.\n- Ежедневно проверять рекламу и следить за объявлениями конкурентов. На ЦИАНе подписаться на свой ЖК и на соседний.\n- Хорошие фото. Яндекс может отснять объект и сделать 3D-тур, его потом можно использовать.\n- Снижать цену ощутимо и обоснованно (см. [Цена и снижение](#cena-i-snizhenie)).\n- Выстраивать лояльность покупателей.\n\n## Пример: что знать про свой дом (ЖК Hide)\nТак выглядит «экспертность по дому» на практике. Три башни по 41 этажу: Westdale, Parklane, Riverside, 863 квартиры. Концепция «вертикального дома»: лобби, фитнес, SPA, детский центр, кафе. Приватный парк, двухуровневый подземный паркинг. ТТК в 100 м, Кутузовский 5 минут, Сити 15 минут, метро пешком далеко. Рядом строится hideOUT (ввод 2028). Такие факты ты называешь собственнику и покупателю, не подсматривая.\n\n## Связанные темы\n- [Источники объектов](#istochniki-obektov)\n- [Объявление и фото](#obyavlenie-i-foto)", "q": ["Почему мы работаем в одном ЖК, а не по всей Москве?", "Что нужно знать про свой ЖК?", "Как понять, что я «выучил» ЖК?", "Когда стажёр начинает работать по ЖК?", "Что такое «монополия в ЖК»?"]}, "kommercheskaya-nedvizhimost": {"t": "Коммерческая недвижимость за 3 дня", "n": "Коммерческая недвижимость за 3 дня", "sec": "02-product", "md": "**Отвечает на вопросы:**\n- Чем офисы, стрит-ритейл и ПСН отличаются друг от друга?\n- Как посчитать доходность объекта и окупаемость?\n- Как работает НДС и кому он выгоден?\n- Какие налоги платит собственник коммерции?\n- Как предлагать коммерцию клиентам?\n\n**Коротко:** курс в 3 дня. Азбука и рынок, экономика объекта и налоги, договор аренды, сделка и как предлагать клиентам. ⚠️ Составлен с помощью ИИ по открытым источникам, цифры актуальны на октябрь 2026. Ставки, налоги и цены проверяй перед тем, как называть клиенту.\n\n**Вопросы собственнику коммерции на созвоне** (из практики, объект на 2000 м² в БЦ): см. блок в конце файла.\n\n2026-10-26 · @someone\n\n## Как пройти курс\n\nЧерез 3 дня ты умеешь: за 5 минут квалифицировать клиента на коммерцию, посчитать доходность объекта, объяснить выгоду по НДС и довести сделку до задатка. Цифры рынка — на октябрь 2026, налоги — по НК РФ с изменениями 2026 года.\n\n| День | Тема | Что делаешь | Результат |\n| --- | --- | --- | --- |\n| 1 | Продукт и рынок | Разделы 1–3. Разбираешь 10 живых объявлений на ЦИАН: класс, ставка, площадь, OPEX | Говоришь на языке арендаторов и инвесторов |\n| 2 | Деньги и налоги | Разделы 4–6. Считаешь руками 3 объекта: NOI, cap rate, окупаемость, НДС к вычету | Показываешь клиенту цифры, а не «хороший объект» |\n| 3 | Сделка и продажа | Разделы 7–9. Проговариваешь вслух 4 питча и 8 возражений, проходишь самопроверку | Готов звонить и делать предложение |\n\nРежим дня: 2 часа теории, 2 часа практики на реальных лотах, 30 минут пересказа вслух (себе или стажёру). Не пересказал — значит не понял.\n\nНалоговые схемы в этом курсе — чтобы ты понимал логику и задавал правильные вопросы. Конкретную структуру сделки всегда подтверждает бухгалтер или налоговый юрист клиента.\n\n## День 1. Азбука коммерции\n\nКоммерцию покупают не за метры, а за деньги: инвестор покупает поток аренды, компания — экономию на аренде и контроль над офисом. Поэтому сначала учишь язык, на котором это считают.\n\n### Виды объектов\n\n| Тип | Что это | Кто клиент | Главная метрика |\n| --- | --- | --- | --- |\n| Офис в БЦ | Блок или этаж в бизнес-центре | Компании-арендаторы, частные инвесторы (strata) | Ставка ₽/м²/год, класс, локация |\n| ОСЗ / особняк | Отдельно стоящее здание целиком | Крупные компании, фонды, состоятельные частники | Цена объекта, доходность |\n| Стрит-ритейл | Помещение на 1 этаже с витриной и своим входом | Сети (продукты, аптеки, кофейни, ПВЗ), инвесторы | Трафик, ставка ₽/м²/мес |\n| ГАБ | Любое помещение с действующим арендатором | Инвесторы | Доходность, срок и надёжность договора |\n| Апартаменты | Нежилое помещение «для проживания» | Частные инвесторы, иногда компании | Цена ₽/м², налоги как у коммерции |\n| Склад / light industrial | Склад, производство, мастерские | Логистика, маркетплейсы, производство | Ставка ₽/м²/год, высота, полы, ворота |\n| Машино-места, кладовые | Мелкие нежилые лоты | Жильцы ЖК, мелкие инвесторы | Цена лота, аренда в месяц |\n\n### Площади: за что платит арендатор\n\n- **Общая площадь здания (GBA)** — всё здание, включая техэтажи и паркинг. Девелоперы считают себестоимость на неё.\n- **Арендуемая площадь (GLA)** — за что платит арендатор: его блок плюс доля общих зон (холлы, коридоры, санузлы).\n- **Полезная площадь (NLA, usable)** — чем арендатор реально пользуется внутри своего блока.\n- **Коэффициент потерь (load factor)** = арендуемая ÷ полезная − 1. Платит за 1 150 м², сидит на 1 000 м² → коэффициент 15%. Это повод торговаться.\n- При продаже strata цена обычно за площадь помещения по ЕГРН. При аренде — за арендуемую. Всегда уточняй: «ставка за какую площадь и что в неё входит».\n\n### Из чего состоит ставка аренды\n\n```latex\n\\text{Платёж} = (\\text{базовая ставка} + \\text{OPEX} + \\text{коммуналка}) \\times (1 + \\text{НДС})\n```\n\n- **Базовая ставка** — чистый доход собственника, ₽/м²/год. Консультанты публикуют ставки именно так: без OPEX, коммуналки и НДС.\n- **OPEX** — эксплуатация: охрана, уборка общих зон, обслуживание инженерки, управление. Обычно отдельной строкой, индексируется ежегодно.\n- **Коммуналка** — по счётчикам или фиксированной суммой.\n- **НДС 22%** — сверху, если арендодатель на ОСНО или на УСН с доходом выше 20 млн ₽ в год (подробно в разделе про НДС).\n- **Gross / «всё включено»** — одна цифра, внутри всё. Частники и мелкий стрит-ритейл любят так сдавать.\n- Перевод: ₽/м²/год ÷ 12 = ₽/м²/мес. 36 000 ₽/м²/год = 3 000 ₽/м²/мес.\n\n### 20 терминов, без которых не звонить\n\n| Термин | Что значит |\n| --- | --- |\n| Вакантность | Доля свободных площадей в сегменте, %. Растёт — рынок арендатора, падает — рынок собственника |\n| Поглощение | Сколько м² за период реально заняли арендаторы и покупатели |\n| Strata | Продажа офисов в БЦ блоками и этажами разным собственникам |\n| ГАБ | Готовый арендный бизнес: помещение продаётся вместе с действующим арендатором |\n| ДКПБН | Договор купли-продажи будущей недвижимости — основная схема покупки строящихся офисов (не ДДУ, без эскроу) |\n| BTS (build-to-suit) | Здание строят под конкретного арендатора или покупателя |\n| Sale & leaseback | Компания продаёт свой офис инвестору и сразу берёт его в аренду |\n| Shell & core | «Бетон»: стены, перекрытия, инженерия до этажа, без отделки |\n| White box | Базовая отделка: ровные стены, потолок, свет, иногда санузел |\n| Fit-out | Отделка под арендатора; кто платит — предмет торга |\n| Арендные каникулы | Месяцы без базовой ставки на время ремонта и заезда |\n| Индексация | Ежегодный рост ставки: фикс % или по инфляции (ИПЦ) с потолком |\n| Обеспечительный платёж | Депозит арендатора, обычно 1–3 месячных платежа |\n| Break option | Право арендатора досрочно выйти из договора; снижает ценность ГАБ |\n| Якорный арендатор | Крупный надёжный арендатор (сеть, банк), который держит объект |\n| NOI | Чистый операционный доход: аренда минус расходы собственника за год |\n| Cap rate | Ставка капитализации: NOI ÷ цена объекта, % |\n| ОСЗ | Отдельно стоящее здание |\n| ПСН | Помещение свободного назначения — можно под магазин, офис, услуги |\n| МФК | Многофункциональный комплекс: офисы, апартаменты, ритейл в одном объекте |\n\n## День 1. Офисы: классы, форматы, рынок Москвы\n\nВ 2026 году офисный рынок Москвы развернулся: рекордный ввод, вакантность выросла до 7,1%, запрашиваемые ставки перестали расти. Для арендатора это первый за три года шанс торговаться, для инвестора в strata — сигнал выбирать локацию очень жёстко.\n\n### Классы офисов\n\n| Класс | Что это | Кто там сидит |\n| --- | --- | --- |\n| Prime / A+ | Лучшие новые здания в топ-локациях: Сити, Белорусский район, центр. Сильная инженерия, виды, сервис | Банки, юрфирмы, крупный IT, штаб-квартиры |\n| A | Новый или глубоко реконструированный БЦ, профессиональная УК, центральное кондиционирование, свободные планировки, подземный паркинг | Крупный и средний бизнес |\n| B+ | Новые здания попроще или хорошая реконструкция. Компромисс по локации, паркингу или планировкам | Средний бизнес, бэк-офисы |\n| B | Старый фонд после ремонта: бывшие НИИ, особняки, административные здания | Малый и средний бизнес, госзаказчики |\n| C | Здания без нормального ремонта, полуподвалы, советские НИИ | Микробизнес, склады-офисы |\n\nКласс в объявлении часто завышают. Проверяй сам: год постройки, кто УК, кондиционирование, паркинг, высота потолков, вход и лифты.\n\n### Рынок Москвы, III квартал 2026\n\n| Показатель | Значение |\n| --- | --- |\n| Вакантность, весь рынок | 7,1% (+2,3 п.п. за год), к концу года ждут 7,8% |\n| Вакантность, класс A / B+ | 8,7% / 6,5%; к концу года ждут 10% / 7,3% |\n| Средневзвешенная запрашиваемая ставка (Prime, A, B+, B−) | 33,2 тыс. ₽/м²/год, +11% за год |\n| Ставка класса A: в среднем / внутри МКАД / за МКАД | 36,4 / 41,5 / 26,8 тыс. ₽/м²/год |\n| Ввод за III квартал | 836 тыс. м², 43 БЦ; прогноз на 2026 — 1 066 тыс. м², рекорд с 2014 года |\n| Ввод за 9 месяцев: куда идут площади | 59% на продажу, 26% build-to-suit, 13% в аренду |\n| Новые сделки классической аренды за III квартал | 77,4 тыс. м² против 149 тыс. год назад; 79% объёма — класс B |\n| Цена продажи класса A, зона СК–ТТК | 613 тыс. ₽/м² без НДС, +36% за год; по Москве 497 тыс., Белорусский район 663 тыс. (I полугодие) |\n| Рост цены от старта продаж до ввода | 50–60% в высококлассных БЦ |\n\nСтавки по обзорам консультантов — без OPEX, коммуналки и НДС. Разные консультанты считают вакантность по-разному (по другой методике в классе A получается 11,6%), поэтому не смешивай цифры из разных обзоров.\n\n### Ставки по деловым районам\n\n\nВ Сити ставки класса A за год упали на 14%, а в Новой Москве выросли на 41%: в центре сейчас торгуется арендатор, на окраинах диктует собственник.\n\n### Что это значит для клиента\n\n- **Арендатор класса A.** Свободных блоков стало больше, сделок вдвое меньше. Торгуйся за каникулы, отделку за счёт собственника и потолок индексации.\n- **Арендатор класса B.** Предложение вымывается, спрос сместился сюда. Решения принимать быстро, хорошие блоки уходят.\n- **Частный инвестор в strata класса A.** Главный риск 2026 года: на вторичку выходят лоты других частников, купленные «под сдачу», и они конкурируют за того же арендатора. Консультанты прямо называют это причиной роста вакантности в классе A. Брать только дефицитные локации внутри ТТК и проверять, сколько таких же лотов в здании уже сдаётся.\n- **Компания, которая думает купить офис вместо аренды.** Покупка снова в моде, но сравнивай честно: ставка внутри МКАД около 41,5 тыс. ₽/м²/год против цены 500–600 тыс. ₽/м². Окупаемость через сэкономленную аренду — 12–15 лет до налогов и расходов. Аргументы «за» — контроль, актив на балансе и вычет НДС (День 2).\n\n### Форматы сделок с офисами\n\n| Формат | Как работает | Кому продавать |\n| --- | --- | --- |\n| Аренда | Договор на 3–7 лет, ставка + OPEX + НДС | Компаниям, которым нужен офис без заморозки капитала |\n| Покупка готового блока | ДКП, сразу право собственности | Компаниям под себя, инвесторам |\n| Покупка на стройке | ДКПБН (не ДДУ, без эскроу): платёж по графику, право — после ввода | Инвесторам на росте цены; риск — девелопер и сроки |\n| ГАБ | Покупка блока с арендатором внутри | Инвесторам за потоком |\n| Sale & leaseback | Компания продаёт свой офис инвестору и остаётся арендатором | Собственникам-компаниям, которым нужны деньги в бизнес |\n\n## День 1. Стрит-ритейл, ПСН, апартаменты, мелкие лоты\n\nДля брокера элитных ЖК это самый близкий рынок: первые этажи премиальных комплексов, апартаменты, машино-места и кладовые покупают те же люди, что покупают квартиры. Продаёшь их как второй продукт тому же клиенту.\n\n### Стрит-ритейл и ПСН: что проверять\n\n| Параметр | Почему важно |\n| --- | --- |\n| Трафик | Пешеходный и автомобильный поток у входа. Нет трафика — нет сетевого арендатора |\n| Вход и витрина | Отдельный вход с улицы и витринное остекление — обязательно для сетей |\n| Электрическая мощность, кВт | Продуктам, общепиту и клиникам нужно много. Нехватку докупать дорого и долго |\n| Вытяжка и мокрая точка | Без вытяжки на кровлю общепит невозможен, без воды — салоны и клиники |\n| Ограничения МКД | В жилом доме часть профилей запрещена или требует согласия жильцов (шумное кафе, алкоголь у школы) |\n| Разгрузка | Продуктовой сети нужна зона разгрузки и подъезд для машины |\n| Назначение по ЕГРН | Должно быть нежилое помещение, а не квартира на первом этаже |\n\n### Кто арендует стрит-ритейл\n\n| Профиль | Ориентир площади | Что им важно |\n| --- | --- | --- |\n| Продукты «у дома» | 150–500 м² | Плотная жилая застройка вокруг, разгрузка, мощность |\n| Аптеки | 50–150 м² | Угол, витрина, трафик к метро или поликлинике |\n| ПВЗ маркетплейсов | 30–100 м² | Плотность жилья, вход с улицы, низкая ставка |\n| Кофейни, пекарни | 30–100 м² | Утренний трафик, вытяжка, летняя веранда |\n| Медицина, стоматология, косметология | 80–300 м² | Мощность, вода, тихий премиальный район |\n| Салоны, барбершопы, цветы | 30–100 м² | Платёжеспособные жители ЖК рядом |\n\nПлощади — рыночные ориентиры. Перед звонком в сеть сверяй её опубликованные требования к помещениям.\n\n### Апартаменты: продаются как жильё, налоги как у коммерции\n\n- Юридически это нежилое помещение. Налоговый вычет при покупке и льготная ипотека не положены, постоянной регистрации нет.\n- Застройщик продаёт апартаменты с НДС (в отличие от квартир). Для компании на ОСНО это плюс: НДС можно принять к вычету, если апартаменты используются в бизнесе — под сдачу или служебное жильё.\n- Налог на имущество считается по кадастру и обычно выше, чем у квартиры той же стоимости.\n\n### Машино-места и кладовые\n\nНизкий входной билет и стабильный спрос жителей ЖК. Продаются как отдельный лот с правом собственности. Хороший апсейл к квартире в элитном ЖК: предлагаешь в момент сделки, пока клиент «в покупке».\n\n### Практика Дня 1\n\n- [ ] Разобрать 10 объявлений офисов на ЦИАН: класс, ставка за м²/год, что входит (OPEX, НДС), коэффициент потерь\n- [ ] Разобрать 5 помещений стрит-ритейла в своих ЖК: вход, витрина, мощность, вытяжка, кто мог бы арендовать\n- [ ] Пересказать вслух: чем класс A отличается от B+, что такое ДКПБН и почему в 2026 году вакантность в A растёт\n\n## День 2. Экономика объекта: как считать доходность\n\nИнвестор сравнивает объект с депозитом. Ключевая ставка ЦБ — 14%, её сохранили 23 октября 2026 года. Поэтому объект с чистой доходностью 6–8% продаёшь не процентом, а ростом цены, индексацией аренды, качеством арендатора и защитой капитала.\n\n### Формулы\n\n```latex\n\\begin{aligned}\n\\text{Потенциальный доход} &= \\text{площадь} \\times \\text{ставка}_{\\text{м}^2/\\text{год}} \\\\\n\\text{Эффективный доход} &= \\text{потенциальный} \\times (1 - \\text{вакантность и недосбор}) \\\\\n\\text{NOI} &= \\text{эффективный} - \\text{расходы собственника} \\\\\n\\text{Cap rate} &= \\text{NOI} \\div \\text{цена} \\\\\n\\text{Окупаемость, лет} &= \\text{цена} \\div \\text{NOI}\n\\end{aligned}\n```\n\nРасходы собственника: налог на имущество, неотбиваемый OPEX, управление, страховка, резерв на ремонт, комиссия брокеру при смене арендатора. Налог на доход считается отдельно — после NOI.\n\n**Правило:** всегда называй клиенту две цифры — брутто (аренда ÷ цена) и чистую (после расходов и налогов). В объявлениях ГАБ почти всегда пишут брутто.\n\n### Пример 1. Стрит-ритейл в ЖК с аптекой\n\n| Строка | Расчёт | Сумма |\n| --- | --- | --- |\n| Цена | 80 м² × 600 тыс. ₽ | 48 млн ₽ |\n| Аренда в год | 400 тыс. ₽/мес × 12 | 4,8 млн ₽ |\n| Брутто-доходность | 4,8 ÷ 48 | 10,0% |\n| Минус риск простоя 5% | 4,8 × 0,95 | 4,56 млн ₽ |\n| Минус налог на имущество | кадастр 30 млн × 2% (проверь ставку объекта) | −0,6 млн ₽ |\n| Минус управление и страховка | допущение | −0,15 млн ₽ |\n| NOI |  | 3,81 млн ₽ |\n| Cap rate | 3,81 ÷ 48 | 7,9% |\n| После налога ИП на УСН 6% с дохода | 3,81 − 4,56 × 6% | 3,54 млн ₽ → 7,4% |\n\nИнвестор видит «10%», а реально получает 7–8%. Это ниже ключевой ставки. Аргументы за объект: аптека платит с индексацией, помещение в ЖК дорожает вместе с районом, депозитная ставка будет снижаться, а договор аренды останется.\n\n### Пример 2. Strata-офис класса A для частника и для компании\n\n| Строка | Частник (не платит НДС) | ООО на ОСНО |\n| --- | --- | --- |\n| Цена 120 м² × 550 тыс. ₽ без НДС | 66 млн + НДС 14,5 млн = 80,5 млн ₽ — НДС это его расход | 80,5 млн ₽, НДС 14,5 млн ₽ к вычету → фактически 66 млн ₽ |\n| Аренда 41,5 тыс. ₽/м²/год | 4,98 млн ₽ | 4,98 млн ₽ (+ НДС сверху, его платит арендатор) |\n| Минус простой и каникулы 10% | 4,48 млн ₽ | 4,48 млн ₽ |\n| Минус налог на имущество (кадастр 50 млн × 2%) и управление | −1,1 млн ₽ | −1,1 млн ₽ |\n| NOI | 3,38 млн ₽ | 3,38 млн ₽ |\n| Cap rate на вложенные деньги | 4,2% | 5,1% |\n\nДва вывода. Первый: strata класса A — это ставка на рост цены (+50–60% от старта продаж до ввода), а не на аренду. Второй: одинаковый офис для компании на ОСНО на 18% дешевле, чем для частника, — за счёт вычета НДС. Это твой главный аргумент «покупай на юрлицо».\n\n### Пример 3. Купить офис или снимать: компания на 300 м²\n\n| Строка в год | Аренда | Покупка |\n| --- | --- | --- |\n| Деньги на входе | Депозит 1–3 месяца | 165 млн ₽ без НДС (НДС 36,3 млн ₽ — к вычету) |\n| Аренда 41,5 тыс. × 300 м² | 12,45 млн ₽ (НДС к вычету) | — |\n| Налог на имущество (кадастр 120 млн × 2%) | — | 2,4 млн ₽ |\n| Упущенный доход на 165 млн ₽ под 14% | — | 23,1 млн ₽ до налога |\n\nПри ключевой 14% аренда дешевле покупки в живых деньгах. Покупку продаёшь, когда у компании есть свободный капитал, она ждёт роста цен и ставок аренды, хочет контроль над офисом и актив под залог. Сравнение пересчитывай каждый раз, когда меняется ключевая ставка.\n\n### ГАБ: чек-лист качества дохода\n\n- [ ] Арендатор: сеть или мелкое ИП? Проверить в Контур.Фокус или СПАРК: суды, долги, ФССП\n- [ ] Срок договора и регистрация в ЕГРН (договор на год и больше регистрируется)\n- [ ] Право досрочного выхода и штраф за него\n- [ ] Индексация: фикс или по инфляции\n- [ ] Ставка рыночная? Завышенная ставка у «своего» арендатора — классическая схема: объект продают дорого, арендатор съезжает через полгода\n- [ ] Платёжная дисциплина: выписка поступлений за 12 месяцев\n- [ ] Кто платит OPEX и коммуналку\n- [ ] Обеспечительный платёж переходит к покупателю по акту\n\n## День 2. НДС: главный козырь в коммерции\n\nС 1 января 2026 года НДС — 22%, расчётная ставка 22/122. Покупатель-плательщик НДС возвращает через вычет примерно 18% цены: офис за 122 млн ₽ у застройщика стоит такой компании 100 млн ₽. Это главный аргумент, почему коммерцию выгодно покупать на юрлицо.\n\n```latex\n\\text{НДС в цене} = \\text{Цена с НДС} \\times \\frac{22}{122} \\qquad 122 \\text{ млн} \\times \\frac{22}{122} = 22 \\text{ млн к вычету}\n```\n\n### Кто платит НДС в 2026 году\n\n| Продавец или арендодатель | НДС с продажи и аренды | Вычеты |\n| --- | --- | --- |\n| ООО или ИП на ОСНО | 22% | Да |\n| УСН, доход до 20 млн ₽ | Освобождён | Нет |\n| УСН, доход 20–272,5 млн ₽ | 5% без вычетов, или 22% с вычетами по выбору | Только на 22% |\n| УСН, доход 272,5–490,5 млн ₽ | 7% без вычетов, или 22% с вычетами | Только на 22% |\n| Физлицо без ИП | Не плательщик (но риск переквалификации, ниже) | Нет |\n| Самозанятый | Нежилое на НПД сдавать нельзя — только жильё | — |\n\nПорог 20 млн ₽ заморожен: закон подписан в июле 2026 года, 20 млн действуют в 2027–2029 годах, снижение до 15 млн перенесено на 2030 год, до 10 млн — на 2031 год.\n\n### Что облагается, а что нет\n\n| Операция | НДС |\n| --- | --- |\n| Продажа офиса, ПСН, ОСЗ, апартаментов, машино-места от плательщика НДС | 22% |\n| Аренда нежилого помещения | 22% (у УСН — 5% или 7%) |\n| Продажа квартиры (жилого помещения) | Освобождена, пп. 22 п. 3 ст. 149 НК |\n| Аренда жилья | Освобождена, пп. 10 п. 2 ст. 149 НК |\n| Земельный участок | Не объект НДС, пп. 6 п. 2 ст. 146 НК. При покупке ОСЗ с землёй НДС только на здание — проверяй, как поделена цена |\n| Аренда помещения у города или государства | Арендатор — налоговый агент: сам удерживает НДС и платит в бюджет, п. 3 ст. 161 НК |\n\n### Вычет при покупке: пять условий\n\n1. Покупатель платит НДС по общей ставке: ОСНО или УСН, выбравшая 22%.\n2. Продавец — плательщик НДС и выставил счёт-фактуру. Без счёта-фактуры вычета нет.\n3. Объект используется в облагаемой деятельности: сдаётся в аренду с НДС или работает как офис бизнеса с НДС.\n4. Объект принят к учёту. На практике вычет заявляют после акта приёма-передачи и принятия к учёту, не дожидаясь регистрации в ЕГРН; вычет со счёта 08 иногда оспаривают — решает бухгалтер клиента.\n5. Заявить вычет можно в течение трёх лет после принятия к учёту, п. 1.1 ст. 172 НК.\n\n**Вычет с авансов — твой аргумент для стройки.** Если по ДКПБН клиент платит частями, а договор предусматривает предоплату, продавец выставляет счета-фактуры на авансы, и покупатель вправе сразу принять к вычету НДС с каждого платежа (п. 12 ст. 171, п. 9 ст. 172 НК). Деньги возвращаются в бизнес не после ввода, а по ходу графика.\n\nЕсли вычетов больше, чем НДС к уплате, разница возмещается из бюджета после камеральной проверки. Быстрее всего вычет «съедают» компании с большой выручкой с НДС.\n\n### Ловушки\n\n- **Сменил режим или назначение.** Компания перешла на УСН без НДС или стала использовать объект в необлагаемых операциях — НДС придётся восстановить: с остаточной стоимости или по ст. 171.1 НК частями в течение 10 лет.\n- **Купил у физлица или упрощенца без НДС.** Вычета нет. Сравнивай цены честно: 100 млн ₽ без НДС от физлица — это то же, что 122 млн ₽ с НДС от застройщика для покупателя на ОСНО.\n- **Перепродажа объекта, купленного без НДС.** Продавец-плательщик начисляет НДС при продаже, и база (вся цена или разница) — предмет споров по п. 3 ст. 154 НК. Вопрос бухгалтеру до сделки.\n- **Апартаменты или офис для жизни собственника.** Это не облагаемая деятельность — вычет снимут.\n- **Цена в договоре.** Всегда пиши «в том числе НДС 22%» или «плюс НДС 22%». Без оговорки — спор, кто платит налог.\n- **Физлицо-«рантье».** Если человек без ИП регулярно продаёт или сдаёт коммерцию юрлицам, налоговая может признать это предпринимательством и доначислить НДС и НДФЛ за три года плюс штраф до 40%. Признак систематичности — уже две и более однородные сделки.\n\n### Кому что предлагать по логике НДС\n\n| Клиент | Что для него НДС | Что предлагать |\n| --- | --- | --- |\n| ООО на ОСНО | Возвращается через вычет | Объекты с НДС от застройщика, ДКПБН с вычетом с авансов |\n| ООО или ИП на УСН без НДС | Чистый расход | Объекты без НДС: от физлиц и упрощенцев до 20 млн |\n| Частный инвестор | Чистый расход | Вторичку без НДС; или покупку через свою компанию на ОСНО под сдачу с НДС — посчитать с бухгалтером |\n| Арендатор на ОСНО | Возвращается | Сравнивать ставки без НДС. Арендодатель на 5% для него хуже: вычет только 5% |\n| Арендатор на УСН без НДС | Чистый расход | Искать арендодателей без НДС: физлица, ИП и ООО на УСН до 20 млн ₽ |\n\n## День 2. Налоги собственника: имущество, аренда, продажа\n\nУ собственника коммерции три налога: на имущество, на доход от аренды и на продажу. Ты их знаешь, чтобы честно посчитать чистую доходность и подсказать клиенту, на кого оформлять объект — физлицо, ИП или ООО.\n\n### Налог на имущество\n\n| Владелец | База | Ставка (Москва, 2026) |\n| --- | --- | --- |\n| Организация, объект в кадастровом перечне Москвы | Кадастровая стоимость | 2,0%, в том числе для объектов дороже 300 млн ₽ — Москва повышенную ставку 2,5% не вводила |\n| Организация, объекта нет в перечне | Среднегодовая балансовая стоимость | До 2,2% |\n| ИП на УСН или патенте | Освобождён, кроме объектов из кадастрового перечня — по ним платит | По ставкам для физлиц |\n| Физлицо | Всегда кадастровая стоимость | Для коммерции из перечня до 2%, для объектов дороже 300 млн ₽ — 2,5% |\n\nКадастровая оценка Москвы обновилась с 2026 года и для многих объектов выросла. Кадастр выше рынка можно оспорить — это хороший повод позвонить собственнику: «посмотрим, не переплачиваете ли вы налог».\n\n### Налог на доход от аренды\n\n| Режим собственника | Налог | Что важно |\n| --- | --- | --- |\n| Физлицо без ИП | НДФЛ 13–22% по прогрессии | Если арендатор — компания или ИП, он налоговый агент и сам удерживает НДФЛ. Риск переквалификации в предпринимателя |\n| Самозанятый | Нельзя | На НПД сдаётся только жильё |\n| ИП на УСН «доходы» | 6% с дохода | Самый частый режим рантье. Доход выше 20 млн ₽ в год — плюс НДС 5% или 22% |\n| ИП на патенте | Фиксированная стоимость патента | Лимит дохода — 20 млн ₽ в 2026 году |\n| ООО на ОСНО | Налог на прибыль 25% + НДС 22% | Логично, если объект куплен с НДС и арендаторы на ОСНО |\n\n### Налог при продаже\n\n**Физлицо.** НДФЛ 13% с дохода до 2,4 млн ₽ и 15% с превышения. Доход можно уменьшить на документально подтверждённые расходы на покупку или на вычет 250 тыс. ₽ для нежилого. Если цена в договоре ниже 70% кадастра, налог считают от 70% кадастра (ст. 214.10 НК).\n\n**Срок владения.** Без налога нежилое можно продать после 5 лет владения (3 года — если получено в наследство или в подарок от родственника). Но если помещение использовалось в предпринимательстве, освобождение по сроку не действует (п. 17.1 ст. 217 НК), и при переквалификации гражданин платит налог со всей суммы продажи.\n\n**ИП на УСН.** Если объект использовался в бизнесе, продажа — доход по УСН: 6% со всей цены, без вычета расходов на покупку. Крупная продажа выведет ИП за порог 20 млн ₽, и НДС возникнет с первого числа следующего месяца — сама сделка без НДС, а аренда дальше пойдёт с НДС.\n\n**ООО на ОСНО.** Налог на прибыль 25% с разницы между ценой и остаточной стоимостью плюс НДС 22% с продажи.\n\n### Что подсказать клиенту про структуру\n\nФинальное решение — за бухгалтером клиента. Твоя задача — задать правильный вопрос и показать порядок цифр.\n\n| Ситуация | Обычно выгоднее |\n| --- | --- |\n| Частник, 1–2 помещения стрит-ритейла, сдаёт в долгую | ИП на УСН 6% или патент вместо «просто физлица»: ниже риск переквалификации |\n| Покупка нового офиса или апартаментов у застройщика с НДС под сдачу компаниям на ОСНО | ООО на ОСНО: вычет около 18% цены |\n| Компания на ОСНО покупает офис под себя | Покупка на компанию с вычетом НДС; сравнить с арендой по Примеру 3 |\n| Инвестор планирует продать через 3–5 лет | Заранее посчитать налог на выходе: у ИП на УСН — 6% с цены, у физлица — НДФЛ, если срок не прошёл или объект сдавался |\n\n### Практика Дня 2\n\n- [ ] Посчитать руками 3 объекта из своей базы: брутто, NOI, cap rate, окупаемость\n- [ ] Для одного офиса посчитать цену «для частника» и «для ООО на ОСНО» с учётом вычета НДС\n- [ ] Проверить один объект своего собственника: есть ли он в кадастровом перечне Москвы и какой налог он платит\n- [ ] Объяснить вслух за 60 секунд: почему компании на ОСНО выгодно покупать у застройщика с НДС\n\n## День 3. Договор аренды: 12 условий, о которых торгуются\n\nДоговор аренды — это и есть продукт в ГАБ: инвестор покупает не стены, а эти 12 строк. Знай, что в каждой выгодно арендатору и что защищает собственника.\n\n| Условие | Выгодно арендатору | Защищает собственника | Норма |\n| --- | --- | --- | --- |\n| Срок | Короткий с правом продления | Длинный, 5–10 лет, без права выхода | Договор от года регистрируется в ЕГРН (ст. 651 ГК) |\n| Ставка | Фикс без НДС, OPEX включён | Ставка + OPEX + коммуналка + НДС отдельно | — |\n| Индексация | Потолок 3–5% или без индексации | Фикс 5–7% или по инфляции без потолка | — |\n| Каникулы | 2–6 месяцев на ремонт | Минимум; платёж за OPEX с первого дня | — |\n| Отделка | За счёт собственника или компенсация | Shell & core или white box, отделка за арендатором | Неотделимые улучшения с согласия собственника — компенсация, если договор не говорит иное (ст. 623 ГК) |\n| Обеспечительный платёж | 1 месяц, возврат при выезде | 2–3 месяца, зачёт в счёт долгов и штрафов | Ст. 381.1 ГК |\n| Досрочный выход | Отказ с уведомлением за 2–3 месяца | Штраф: остаток платежей или 6–12 месяцев | — |\n| Субаренда | Разрешена | Только с письменного согласия | С согласия арендодателя (ст. 615 ГК) |\n| Продление | Преимущественное право на тех же условиях | Новая ставка по рынку | Ст. 621 ГК |\n| Смена собственника | Договор сохраняется | — | Продажа объекта не прекращает аренду (ст. 617 ГК) — основа ГАБ |\n| Перепланировки и вывеска | Разрешены, согласует собственник | За счёт и под ответственность арендатора | Перепланировку и вывеску согласуют в городе |\n| Юридический адрес | Предоставляется | За отдельную плату | — |\n\n**Регистрация.** Договор на год и больше без регистрации в ЕГРН не защищает арендатора от нового собственника и снижает ценность ГАБ. Договор на 11 месяцев с автопролонгацией проще, но инвестор при покупке ГАБ дисконтирует его как ненадёжный.\n\n**Твоя комиссия.** В аренде её обычно платит собственник. Фиксируй размер и порядок оплаты в договоре с ним до первого показа.\n\n## День 3. Сделка купли-продажи коммерции\n\nВ коммерции сделку срывает не цена, а документы: перепланировка без согласования, долг по земле, одобрение крупной сделки, которого нет. Проверяешь до задатка, а не после.\n\n### Порядок сделки\n\n1. Квалификация покупателя: цель, бюджет, режим налогообложения, источник денег, кто подписывает.\n2. Подбор и показ. Сразу запрашиваешь выписку ЕГРН и договоры аренды (для ГАБ).\n3. Проверка объекта и продавца — чек-лист ниже.\n4. Предварительный договор или соглашение о задатке: цена с НДС или без, сроки, условия возврата.\n5. Основной договор (ДКП), расчёты через аккредитив или депозит нотариуса.\n6. Подача в Росреестр, регистрация перехода права. Госпошлина за регистрацию права — 4 000 ₽ для физлица и 44 000 ₽ для организации (пп. 22 п. 1 ст. 333.33 НК).\n7. Акт приёма-передачи, переход договоров аренды и обеспечительных платежей, переоформление коммуналки и OPEX. Для покупателя на ОСНО — счёт-фактура и принятие к учёту для вычета НДС.\n\n### Чек-лист проверки объекта\n\n- [ ] Выписка ЕГРН: собственник, обременения, ипотека, аресты, зарегистрированные аренды\n- [ ] Назначение помещения: нежилое; для ОСЗ — вид разрешённого использования земли и права на неё (собственность или аренда у города, срок)\n- [ ] Техплан и экспликация совпадают с фактом. Незаконная перепланировка или реконструкция — штраф и требование вернуть как было\n- [ ] Кадастровый перечень Москвы: войдёт ли объект в налог по кадастру и сколько это в год\n- [ ] Долги по коммуналке, OPEX, аренде земли\n- [ ] Объект культурного наследия: ограничения на ремонт и фасад\n- [ ] Договоры аренды (для ГАБ): чек-лист из Дня 2\n\n### Чек-лист проверки продавца\n\n- [ ] Физлицо: согласие супруга, если объект куплен в браке; нет признаков банкротства — сделку могут оспорить\n- [ ] ООО: устав, полномочия директора, решение участников об одобрении крупной сделки (обычно больше 25% активов) или сделки с заинтересованностью\n- [ ] Суды, ФССП, налоговые долги, признаки банкротства — через Контур.Фокус или СПАРК\n- [ ] Продавец — плательщик НДС? От этого зависит цена для покупателя на ОСНО и наличие счёта-фактуры\n\n### Особенности покупки на стройке (ДКПБН)\n\n- [ ] Разрешение на строительство и ГПЗУ, срок ввода, история переносов у девелопера\n- [ ] График платежей и условие о предоплате — для вычета НДС с авансов\n- [ ] Ответственность девелопера за срыв сроков и условия возврата денег\n- [ ] Что передают: shell & core или white box, точная площадь и порядок доплаты при её изменении\n\n### Деньги на сделку\n\nКоммерческую ипотеку дают компаниям и ИП, при ключевой ставке 14% она дорогая. Сравнивай ставку кредита с cap rate объекта: если кредит дороже доходности, плечо съедает доход. Лизинг недвижимости — альтернатива для компаний на ОСНО: платежи идут в расходы, НДС с них к вычету.\n\n## День 3. Как предлагать коммерцию клиентам\n\nТвой самый тёплый вход — люди, которые у тебя уже есть: собственники в элитных ЖК, их компании и собственники коммерции из базы. Каждому сегменту нужен свой крючок и одна цифра.\n\n### Четыре сегмента и что им продавать\n\n| Сегмент | Крючок | Что предлагать | Цифра для разговора |\n| --- | --- | --- | --- |\n| Собственник квартиры в элитном ЖК, инвестор | Второй актив рядом с домом, который он знает | Стрит-ритейл на первом этаже его ЖК с арендатором, машино-места, strata в дефицитной локации | Чистые 7–8% плюс рост цены и индексация аренды |\n| Владелец бизнеса, компания на ОСНО | Офис или апартаменты на компанию дешевле на величину НДС | Новые офисы и апартаменты у застройщика по ДКПБН с вычетом НДС с авансов | Около 18% цены возвращается через вычет |\n| Собственник коммерции | Сдать или продать дороже, не переплачивать налог | Подбор арендатора из базы сетей, продажа как ГАБ, проверка кадастра | Ставка по рынку и налог в год |\n| Компания-арендатор | Рынок впервые за три года на её стороне | Переезд или пересогласование: каникулы, отделка за счёт собственника, потолок индексации | Вакантность класса A 8,7%, сделок вдвое меньше |\n\n### Скрипты открытия\n\n**Инвестору из ЖК.** «Иван, добрый день, Эль, Эстейтлига. Звоню владельцам в вашем комплексе: на первом этаже продаётся помещение с аптекой, договор на 7 лет с индексацией. Это 7–8% чистыми плюс рост цены вместе с ЖК. Прислать расчёт одной страницей?»\n\n**Владельцу бизнеса.** «Вы сейчас арендуете офис? Сколько метров и сколько платите в месяц? Если покупать на компанию у застройщика, 18% цены возвращается через вычет НДС, причём с авансов — ещё до ввода. Давайте посчитаю ваш офис: покупка против пяти лет аренды.»\n\n**Собственнику коммерции.** «С 2026 года кадастр в Москве пересчитали, и многие платят налог больше рынка. Могу бесплатно проверить ваш объект и показать, за сколько он сейчас сдаётся. У меня база сетевых арендаторов, которые ищут помещения.»\n\n**Арендатору.** «Когда у вас заканчивается договор? Сейчас редкий момент: в классе A свободных площадей больше, сделок вдвое меньше. Собственники дают каникулы и отделку — давайте посмотрим, что можно выжать при продлении или переезде.»\n\n### Вопросы квалификации\n\n1. Цель: поток аренды, рост цены, офис под себя?\n2. Бюджет и источник денег: свои, кредит, продажа другого актива?\n3. На кого покупаем: физлицо, ИП, ООО? Какой режим налогообложения?\n4. Горизонт: сколько лет держать, когда выход?\n5. Готовы к стройке по ДКПБН или только готовый объект?\n6. Какая доходность — порог, ниже которого не интересно?\n7. Кто принимает решение и кто бухгалтер?\n8. Что уже смотрели и почему не купили?\n\n### Возражения\n\n| Возражение | Ответ |\n| --- | --- |\n| «Доходность ниже депозита» | Депозит не дорожает, а ставка по нему падает вслед за ключевой: ЦБ ждёт среднюю ключевую 12,5–13,5% в 2027 году. Договор аренды с индексацией остаётся, помещение растёт в цене |\n| «600 тысяч за метр — дорого» | В классе A внутри Садового–ТТК средняя цена 613 тыс. ₽ без НДС. А для вашей компании на ОСНО — минус 18% через вычет |\n| «У меня нет ООО» | Посчитаем два варианта: на вас и на компанию. Разница может быть 18% цены, решение — с вашим бухгалтером |\n| «Арендатор съедет» | Поэтому берём сеть с договором на 5–10 лет, регистрацией в ЕГРН, депозитом и штрафом за досрочный выход |\n| «Офисы класса A сейчас пустуют» | Да, и поэтому берём только дефицитные локации и проверяем, сколько лотов в здании уже сдаётся. Или стрит-ритейл в плотной застройке |\n| «Лучше куплю квартиру» | У квартиры арендатор меняется каждый год и нет индексации в договоре. У коммерции — сеть на годы и рост ставки по договору |\n| «Подожду, пока снизят ставку» | Когда ставка снизится, деньги пойдут из депозитов в недвижимость, и цены вырастут раньше, чем вы купите |\n| «Не понимаю НДС» | Я подготовлю расчёт на одну страницу для вашего бухгалтера |\n\n### Одностраничный расчёт для клиента\n\nКаждое предложение отправляй одной страницей: объект и фото, цена с НДС и без, арендатор и срок договора, ставка и индексация, брутто, NOI, cap rate, окупаемость, налог на имущество в год, вариант «на физлицо» и «на ООО на ОСНО», риски одной строкой, следующий шаг.\n\n### Практика Дня 3\n\n- [ ] Выучить 4 скрипта и проговорить каждый вслух 5 раз\n- [ ] Отработать 8 возражений с коллегой или стажёром\n- [ ] Сделать одностраничный расчёт по реальному лоту в своём ЖК\n- [ ] Позвонить 10 собственникам из базы с крючком «проверю ваш кадастр» или «помещение на первом этаже вашего ЖК»\n\n## Шпаргалка: цифры на октябрь 2026\n\n| Что | Цифра |\n| --- | --- |\n| НДС | 22%, из цены — 22/122 (≈18%) |\n| Порог освобождения от НДС на УСН | 20 млн ₽ в год, заморожен на 2027–2029 |\n| НДС на УСН | 5% при доходе 20–272,5 млн ₽, 7% при 272,5–490,5 млн ₽, без вычетов; или 22% с вычетами |\n| Ключевая ставка ЦБ | 14% (решение 23.10.2026) |\n| Налог на имущество организаций по кадастру, Москва | 2,0% |\n| Налог на прибыль | 25% |\n| НДФЛ с продажи имущества | 13% до 2,4 млн ₽, 15% сверху |\n| Срок владения нежилым без НДФЛ | 5 лет (3 года — наследство, подарок родственника); не работает, если объект использовался в бизнесе |\n| Госпошлина за регистрацию права | 4 000 ₽ физлицо, 44 000 ₽ организация |\n| Вакантность офисов Москвы | 7,1% весь рынок, 8,7% класс A |\n| Ставка аренды класса A | 36,4 тыс. ₽/м²/год, внутри МКАД 41,5 тыс. |\n| Цена продажи класса A, Садовое–ТТК | 613 тыс. ₽/м² без НДС |\n\n## Самопроверка\n\nЗакрой правую колонку и ответь вслух. Меньше 13 из 15 — перечитай День 2.\n\n| Вопрос | Ответ |\n| --- | --- |\n| 1. Чем арендуемая площадь отличается от полезной? | Арендуемая включает долю общих зон; разница — коэффициент потерь |\n| 2. Что входит в ставку консультантов? | Только базовая ставка: без OPEX, коммуналки и НДС |\n| 3. Что такое ДКПБН? | Договор купли-продажи будущей недвижимости — основная схема покупки строящихся офисов, без эскроу |\n| 4. Почему в 2026 году растёт вакантность в классе A? | Рекордный ввод, слабый спрос и выход на аренду лотов частных инвесторов |\n| 5. Формула cap rate? | NOI ÷ цена |\n| 6. Объявление: «доходность 11%». Что спросить? | Это брутто? Какие расходы, налог на имущество, режим налогообложения, срок и надёжность арендатора |\n| 7. Сколько НДС в цене 61 млн ₽ с НДС? | 61 × 22/122 = 11 млн ₽ |\n| 8. Пять условий вычета НДС при покупке? | Покупатель на общей ставке, продавец-плательщик и счёт-фактура, облагаемое использование, принятие к учёту, три года на заявление |\n| 9. Можно ли брать вычет НДС с авансов по ДКПБН? | Да, если договор предусматривает предоплату и продавец выставил счёт-фактуру на аванс |\n| 10. Упрощенец на 5% сдаёт офис компании на ОСНО. В чём минус для арендатора? | Вычет только 5% вместо 22% |\n| 11. Можно ли сдавать нежилое на самозанятости? | Нет, на НПД — только жильё |\n| 12. Кто платит НДФЛ, если физлицо сдаёт помещение ООО? | ООО как налоговый агент удерживает и перечисляет |\n| 13. ИП на УСН продаёт помещение, которое сдавал. Налог? | 6% со всей цены, без вычета расходов на покупку |\n| 14. Что происходит с арендой при продаже объекта? | Договор сохраняется, новый собственник становится арендодателем (ст. 617 ГК) |\n| 15. Главный риск «своего» арендатора в ГАБ? | Завышенная ставка: объект продают дорого, арендатор уходит после сделки |\n\n## Источники\nОткрытые отраслевые обзоры рынка и налоговые материалы на октябрь 2026.\n\n---\n\n## Вопросы собственнику коммерции (практика)\nЧек-лист для созвона, когда нужно вытащить всю информацию по объекту, чтобы потом предлагать его покупателям.\n\n**1. Объект и метраж.** Как разбита площадь? Номера помещений и этажи, есть ли план БТИ? Один кадастровый номер или несколько, можно ли продать частями? Цена отдельно по лотам и цена оптом.\n**2. Юридический статус.** На кого оформлено (физлицо, юрлицо, ИП)? Обременения: залог, ипотека, арест, суды. Единоличная или долевая собственность, нужно ли согласие второго собственника или супруга? Узаконены ли перепланировки? Срок владения (больше или меньше 5 лет).\n**3. Финансы.** За сколько и когда купил? Ожидания по цене? Форма расчёта? Долги по коммуналке, налогу на имущество, капремонту? Эксплуатационные расходы за м²?\n**4. Аренда.** Сдано полностью или частично? Кто арендаторы и какой у них бизнес? Срок, ставка, индексация, депозит, условия расторжения, как давно сидят? Есть ли у арендатора право преимущественного выкупа? Что будет с арендаторами при продаже? Считал ли доходность в % годовых?\n**5. Техника.** Электромощность (кВт), вентиляция и кондиционирование, машино-места, состояние ремонта и что останется, если арендатор съедет.\n**6. БЦ и УК.** Загруженность здания, якорные арендаторы.\n**7. Мотивация и сроки.** Есть ли дедлайн? Продаёт только через нас или параллельно? Готов ли на эксклюзив?\n**8. Материалы.** Фото, видео, документы; кто показывает объект; цифры доходности за прошлые периоды.\n\n**Покупка у юрлица и у физлица, коротко.** У юрлица на ОСН сделка идёт с НДС, и покупатель-юрлицо на ОСН может взять его к вычету. Нужна проверка компании (ЕГРЮЛ, долги, суды, одобрение крупной сделки). У физлица НДС нет. Есть риск, что регулярную сдачу в аренду переквалифицируют в предпринимательство. Нужно нотариальное согласие супруга, если объект куплен в браке.\n\n**Сильный ход при продаже ПСН:** найти арендатора до продажи и продавать готовый арендный бизнес (ГАБ). Цена сразу выше, и это другой пул покупателей. Продажу как ГАБ считают через мультипликатор 8–10 лет аренды.", "q": ["Чем офисы, стрит-ритейл и ПСН отличаются друг от друга?", "Как посчитать доходность объекта и окупаемость?", "Как работает НДС и кому он выгоден?", "Какие налоги платит собственник коммерции?", "Как предлагать коммерцию клиентам?"]}, "put-sdelki": {"t": "Путь сделки: шесть этапов от звонка до сделки", "n": "Путь сделки", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Из каких этапов состоит работа агента?\n- Что является результатом (ЦКП) каждого этапа?\n- Какой у агента «продукт»?\n\n**Коротко (регламент компании):** вся работа агента — шесть этапов: **Звонок → Встреча → Новый объект → Покупатели → Показы → Задаток/Сделка.** У каждого этапа есть цель и ЦКП (ценный конечный продукт), с которым переходишь на следующий этап. Нет продукта этапа — дальше идти не с чем. «Звонил весь день» — это процесс. Продукт звонка — назначенная встреча. Считай свой день в продуктах.\n\n| Этап | Цель | ЦКП (выход из этапа) | Подробно |\n|---|---|---|---|\n| A. Звонок | Знакомство с продавцом, лояльность, презентация себя | Встреча | [Звонок собственнику](#zvonok-sobstvenniku) |\n| B. Встреча | Лояльность, договорённости, экспертность, анализ объекта и цены | Новый объект в прайсе | [Встреча](#vstrecha-s-sobstvennikom) |\n| C. Новый объект | Монополия в ЖК, причастность к объекту, чтобы весь рынок узнал об объекте | Покупатель | [Объект в прайсе](#obekt-v-praise) |\n| D. Покупатели | Найти и квалифицировать покупателя | Показ | [Покупатели и показ](#pokupateli-i-pokaz) |\n| E. Показ и переговоры | Получить предложение по цене и выйти на переговоры | Задаток | [Покупатели и показ](#pokupateli-i-pokaz) |\n| F. Задаток | Зафиксировать покупателя и намерения сторон | Сделка | [Юридическая база](#yuridicheskaya-baza) |\n\n**Сделка.** С момента задатка или аванса сделку сопровождает юрист компании. После закрытия сделки поставь тег «Бывшие клиенты» в карточках покупателя и продавца.\n\n**Проверочный вопрос стажёру:** «Какой продукт у звонка? А у встречи?» Нарисуй цепочку на листе и держи перед собой.\n\n## Связанные темы\n- [CRM и распорядок дня](#crm-i-rasporyadok-dnya)\n- [Работа по одному ЖК](#rabota-po-odnomu-zhk)", "q": ["Из каких этапов состоит работа агента?", "Что является результатом (ЦКП) каждого этапа?", "Какой у агента «продукт»?"]}, "istochniki-obektov": {"t": "Где брать объекты: источники набора", "n": "Где брать объекты", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Где искать собственников?\n- Что такое «вычисления» и «актуалка»?\n- Что такое «револьверка»?\n- С чего начинать стажёру?\n\n**Коротко:** объекты набираются звонками собственникам. Стажёр начинает с ЦИАНа, это разминка, чтобы научиться говорить. Основная работа потом идёт по базе собственников своего ЖК. Чем больше собственников в работе, тем больше охват.\n\n## Источники (регламент + практика)\n1. **Контакты в CRM** — уже накопленная база компании.\n2. **Пикси** — объекты, которые CRM выгружает в открытые источники (Яндекс, Домклик).\n3. **Вычисления** — находим собственника напрямую, когда он уже продаёт квартиру через другого агента.\n4. **ЦИАН** — объявления собственников. Подпишись на свой ЖК и на соседний.\n5. **Знакомства в ЖК** — охрана, консьержи, управляющая компания.\n6. **Старый экспорт** — старые выгрузки и архивные объявления.\n7. **Чаты жилого комплекса.**\n8. **Лиды** — входящие заявки от колл-центра компании (обработать в течение 24 часов).\n9. **Входящие** — сайты по комплексам, расклейка, буклеты.\n10. **Сфера влияния** — рекомендации, бывшие клиенты.\n\n## Термины\n- **Вычисление** — поиск контакта собственника квартиры, которую уже рекламирует другой агент. Звоним собственнику напрямую.\n- **Актуалка** — твой рабочий список объектов дома, которые продаются через других агентов. В нём ссылка на объявление, контакт собственника, статус («работает / думает / отказ»), условия по оплате («платит / не платит / делиться с агентом / мало платит»), ссылки других агентов на тот же объект. Актуалка ведётся по одному ЖК.\n- **Револьверка** — цикл прозвона базы. Регулярно возвращаешься к каждому контакту, потому что «нет» сегодня — это не «нет» навсегда.\n\n## Типичные ошибки\n- Звонить только по свежим объявлениям и не возвращаться к базе.\n- Не вносить контакт в CRM: потерял будущую сделку.\n\n## Связанные темы\n- [Звонок собственнику](#zvonok-sobstvenniku)\n- [Работа на перспективу](#rabota-na-perspektivu)", "q": ["Где искать собственников?", "Что такое «вычисления» и «актуалка»?", "Что такое «револьверка»?", "С чего начинать стажёру?"]}, "zvonok-sobstvenniku": {"t": "Звонок собственнику: логика, структура, квалификация", "n": "Звонок собственнику", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Как начать звонок собственнику?\n- Какая цель у звонка?\n- Какие вопросы задавать и зачем?\n- Что делать, если собственник спрашивает «а зачем вам эта информация?»\n- Как говорить, чтобы меня слушали?\n\n**Коротко:** мы не просим «дайте взять объект». Мы звоним как агент, который работает по этой локации, и сразу даём пользу: к нам приходят покупатели, и мы можем приводить их к собственнику. Цель каждого звонка — встреча. Если встречи нет, вторая цель — договорённость о следующем звонке.\n\nДословный текст звонка: [Скрипт](#skript-zvonka-sobstvenniku).\n\n## Логика захода (📌 практика наставника)\n- **Польза в первой фразе.** Покупатели спрашивают, что ещё есть рядом. Можно ли предлагать вашу квартиру?\n- **Мы не агент покупателя.** «Мне не платит покупатель. Я работаю в ваших интересах: чем дороже продам, тем выше моя комиссия». Иначе собственник решит, что ты подбираешь квартиру под чужого клиента.\n- **Не звони как колл-центр.** Не «я самый крутой, дайте объект» и не «завтра приведу покупателя». А так: «я давно работаю здесь, буду полезным контактом в вашей записной книжке».\n- **Опора на компанию, если своих объектов ещё нет.** «У наших агентов есть покупатели на ваш метраж. В компании около 2000 объектов». Стажёр не говорит «у меня продаются соседние квартиры», если их нет: это обман (см. Почему уходят стажёры).\n\n## Структура звонка\nпольза → квалификация → три договорённости → возражения → встреча\n\n1. Приветствие и имя.\n2. Вопрос по документам: правоустановка, сколько лет в собственности, есть ли обременения. На это легко отвечать, и так завязывается диалог.\n3. Польза: почему звоню.\n4. Квалификация (таблица ниже).\n5. [Три простые договорённости](#tri-dogovorennosti): показы, презентация, комиссия.\n6. Возражения. Агент сам их вызывает: они всё равно будут, лучше отработать по скрипту.\n7. Встреча с временем: «Такие решения не принимаются по телефону. В 7 или в 8 будет удобно?»\n8. Закрытие: встреча назначена или договорились о следующем звонке. Сразу комментарий и дата в CRM.\n\nС первого звонка «приезжайте» говорят редко. Объекты набираются на повторных звонках и после встречи.\n\n## Квалификация: вопросы и зачем они нужны\n\n| Вопрос | Зачем |\n|---|---|\n| Что по правоустановке? Сколько лет в собственности? | Чистота сделки и налог собственника; лёгкий старт диалога |\n| Обременения, ипотека? Если да: какой банк, есть ли просрочки, гасит сам до сделки или из денег покупателя? | От банка зависит схема и стоимость сделки |\n| Свободная продажа или альтернатива? | Какой покупатель подойдёт и сколько идёт сделка |\n| В какие сроки планируете выйти на сделку? | Срочность — рычаг. «Не тороплюсь» → «отлично, значит, есть время выбрать выгодное предложение» |\n| Почему решили продавать? Что покупаете взамен? | Это первый вопрос любого покупателя. Без мотивации не скорректируешь цену |\n| Как определили цену? | Обычно по непроданным объявлениям ЦИАНа, отсюда вход в разговор о цене |\n| Какой торг закладывали? | Сюда потом закладываем комиссию |\n| Сколько показов в неделю, какая обратная связь? | «Показы есть, а предложений нет» = ходят туристы, нужен агент |\n| Кто принимает решение? | Часто звонишь дочери или брату, а решает собственник |\n\n**Шесть пунктов квалификации по Димитриадису:** срок выхода на сделку, бюджет, лояльность, реалистичность запроса, условия оплаты, уровень мотивации. Приоритет у клиента, который мотивирован, покупает (продаёт) сейчас, с деньгами, лоялен и с простым запросом. Нет ответов на эти пункты — на встречу не едем.\n\n**«Зачем вам эта информация?»** Не пропускаем и не оправдываемся: «Покупатели всегда спрашивают, зачем собственник продаёт. Когда есть понятный ответ, у них нет лишних подозрений». На «какой собственник скажет вам правду»: «Согласен, поэтому перед сделкой мы всё равно проверяем документы. Я с вами искренен, чтобы не тратить время друг друга».\n\n## Принципы разговора\n- **Каждая реплика заканчивается вопросом.** Пока собственник думает над ответом, он в диалоге.\n- **Один вопрос за раз.** Задашь три сразу, и ответят на самый лёгкий.\n- **Ни одно возражение не оставлять без ответа.** Пропущенное возражение даёт собственнику ощущение, что он сильнее в диалоге.\n- **Не придумывай ответ за клиента.** Не «наверное, цена завышена», а «как вы думаете, почему квартира до сих пор не продалась?»\n- **Контролируй ответ.** Ответ — не всегда ответ на твой вопрос. Возвращайся к своему вопросу.\n- **Продавай себя, а не будь «узнавалкой».** Квалификация без пользы — это анкета. У собственника один вопрос: почему именно ты, если звонят десятки агентов.\n- **Уверенность важнее скорости.** Лучше уверенно сказать и помолчать 10 секунд, чем дрожать голосом.\n- **Энергия в голосе.** Пассивный тон — пассивные ответы.\n- **Перебивает и хамит — звони следующему,** не зацикливайся.\n- **Спорный момент закрывай вопросом, а не объяснением:** «Комиссия 4%. Вам удобно встретиться в 6 или в 8?»\n\n**Художественный пример ценности агента:** «Покупатель смотрит мою квартиру на Тверской и спрашивает, есть ли ещё. Я показываю вашу, он предлагает 63 вместо 65, я торгуюсь, беру задаток, юрист ведёт сделку. Без причастности к вашему объекту этого покупателя у вас не будет».\n\n## Типичные ошибки (из конспекта обучения)\nПеребивать клиента. Говорить заученными фразами колл-центра. Не понимать, какой мотив стоит за возражением. Пытаться продавить на продажу с первого звонка. Сразу соглашаться на скидку по комиссии. Не знать рынок. Игнорировать эмоции и страхи. Говорить неуверенно. Хотеть понравиться. Не работать на опережение. Обходить неудобные возражения.\n\n## Связанные темы\n- [Три договорённости](#tri-dogovorennosti)\n- [Возражения собственника](#vozrazheniya-sobstvennika)\n- [Встреча с собственником](#vstrecha-s-sobstvennikom)", "q": ["Как начать звонок собственнику?", "Какая цель у звонка?", "Какие вопросы задавать и зачем?", "Как говорить, чтобы меня слушали?"]}, "tri-dogovorennosti": {"t": "Три простые договорённости: показы, презентация, комиссия", "n": "Три простые договорённости", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- О чём договариваться с собственником?\n- Как попросить разрешение на рекламу?\n- Какую комиссию называть?\n- Что делать, если просят комиссию ниже?\n- Нужен ли агентский договор на первой встрече?\n\n**Коротко:** «Чтобы приводить к вам покупателей, нам нужно достичь трёх простых договорённостей: как показывать, презентация и комиссия». Это главный инструмент и в звонке, и на встрече. Проходишь по пунктам, по одному вопросу за раз.\n\n## 1. Показы\n- «Как вы показываете квартиру? Вы там живёте или подъезжаете?»\n- «В какое время удобно показывать: утром, днём, вечером?»\n- «За какое время вас предупреждать?»\n- Не бойся просить ключи: «Можете оставить на ресепшене или дать дубликат? Тогда не придётся каждый раз подъезжать».\n\n## 2. Презентация (объявление на ЦИАНе)\nКлючевая фраза: **«Мне нужна минимальная причастность к вашему объекту в виде презентации на ЦИАНе».**\n- Я не могу отправлять покупателям ваше объявление: они просто наберут вам напрямую, а коллеги не смогут предлагать ваш объект своим клиентам.\n- ЦИАН — единственная модерируемая площадка с минимумом фейков. На Авито, Яндексе и Домклике фейков больше.\n- ЦИАН — агентская площадка: через неё агенты собирают подборки для покупателей. Поэтому собственнику и звонят агенты.\n- Рекламу оплачиваем мы, собственник ничего не платит.\n- **Агентский договор на первой встрече не нужен:** «Хорошо, ничего не подписываем, агентский подпишем перед сделкой. Дайте мне возможность презентовать вашу квартиру».\n- **Не выставляй объект без разрешения.** Собственник увидит, разозлится и попросит снять. Задача не набрать объект для галочки, а научиться договариваться.\n\n## 3. Комиссия\n- Называй **одну цифру: 4%.** Не «3–4%» и не «среднерыночная»: клиент запоминает минимальную цифру.\n- Формулировка: «Сегодня покупатель на рынке стоит 4%».\n- Просят ниже 3%: «Попробую согласовать с руководством и вернусь с обратной связью». На следующий день перезваниваешь.\n- Уступка только в обмен: «Чтобы руководство пошло на уступки, нужен шаг и с вашей стороны. Если согласую 3%, договоримся об эксклюзиве?»\n- Компромисс лучше отказа. Назвали 2%: «Отлично, вы уже готовы платить, значит, найдём решение. Давайте встретимся».\n\n## Важно\n- 📌 **Комиссию всегда платит собственник.** Покупателю мы ничего не обещаем за его счёт и собственнику не говорим «вам ничего не стоит».\n- **Регламент компании:** ни один объект нельзя выкладывать в рекламу без согласия собственника (подписываем листинг). Ни одна сделка не проходит без подписанного агентского договора. Агентский договор **предлагаем на каждой встрече**. В исключительных случаях работаем без него, но пытаемся подписать при каждом контакте. Крайний срок — до задатка, то есть до встречи покупателя с продавцом. Для подписания нужны выписка ЕГРН (если дом сдан), ДДУ или ДКП и паспорта всех собственников.\n- **Договор на первой встрече — два уровня.** Стажёр сначала учится договариваться о рекламе: на первой встрече главное — устное согласие на рекламу и фото, агентский подписываем перед сделкой. Опытный агент закрывает на договор сразу, как учит Димитриадис: цель — договор на 7 встречах из 10.\n\n## Связанные темы\n- [Звонок собственнику](#zvonok-sobstvenniku)\n- [Возражения: «не даю рекламу», «не плачу комиссию»](#vozrazheniya-sobstvennika)", "q": ["О чём договариваться с собственником?", "Как попросить разрешение на рекламу?", "Какую комиссию называть?", "Что делать, если просят комиссию ниже?", "Нужен ли агентский договор на первой встрече?"]}, "vstrecha-s-sobstvennikom": {"t": "Встреча с собственником: подготовка, ход, дожим, после встречи", "n": "Встреча с собственником", "sec": "03-sales", "md": "**Отвечает на вопросы:**\n- Зачем вообще ехать на встречу, если собственник ничего не подписал?\n- Как подготовиться к встрече?\n- О чём говорить на встрече?\n- Что делать после встречи?\n- Какие вопросы задать себе после встречи?\n\n**Коротко:** после встречи лояльность собственника к тебе выше, чем к 90% агентов, которые ему только звонили. Даже если ничего не подписали, он тебя запомнил. 80% встречи — про человека, а не про сделку. Потом переход к трём договорённостям.\n\n## Чек-лист встречи (регламент компании)\nЦель встречи — лояльность, договорённости, презентация своей экспертности, анализ квартиры и цены. ЦКП — новый объект в прайсе. Встречаемся с собственником, а не с представителем: с тем, кто решает и платит комиссию. Нельзя знакомиться с собственником во время показа: невозможно предлагать квартиру, которую не видел сам.\n- [ ] Подтвердить встречу за 1–2 часа, приехать заранее\n- [ ] Осмотреть квартиру детально глазами покупателя\n- [ ] Презентовать себя и агентство\n- [ ] Отработать возражения, понять мотивацию\n- [ ] Согласовать комиссию и рекламу\n- [ ] Дать анализ рынка: реальная цена сделки по объекту\n- [ ] Предложить агентский договор (устный эксклюзив)\n- [ ] Посмотреть документы по объекту\n- [ ] Проконсультировать по предпродажной подготовке\n- [ ] Обсудить схему сделки\n- [ ] Сделать хорошие фото для рекламы\n- [ ] Зафиксировать встречу в CRM\n\n**С собой:** бахилы, анализ рынка (устно или распечатка), листинг или агентский договор.\n\n**Презентация себя.** Знай свою главную ценность: чем ты полезен собственнику, почему работать с тобой, почему ты продашь лучше, чем он сам. Знай опыт агентства по этому ЖК или аналогичным (руководитель рассказывает).\n\n**Вопросы на встрече (регламент):**\n- *Мотивация:* Точно решили продавать (если завтра придёт покупатель, выйдете на сделку)? Почему? Как быстро? Что дальше: альтернатива, реинвестирование? Как давно продаёте? Что будет, если не продадите?\n- *Ситуация:* Работаете с агентом? Почему решили сами? Как выбрали агента, подписали ли договор? Сколько было показов? Что должен сделать агент, чтобы вы с ним работали?\n- *Объект:* Единственный собственник? Есть прописанные, несовершеннолетние? Когда ремонт? Знакомы с соседями? В каком виде продаёте, остаётся ли мебель? Обременения (банк, долг, чем закрываете)? Стоимость в договоре и сколько лет в собственности? Покупали в браке? Как определили цену, закладывали торг, готовы корректировать? Как показывать: ключи или будете приезжать, в какие дни?\n\n## Подготовка\n- За час позвонить, подтвердить встречу и взять прямой номер.\n- Едешь в ЖК — посмотри 15 минут видео на YouTube про проект и локацию.\n- Звонок до встречи (Димитриадис): «Перед тем как встретимся, могу задать несколько вопросов? Вы когда-нибудь думали продавать сами? Опишите квартиру. Собираетесь встречаться с другими агентами? По какой цене хотели бы выставить и ниже какой не будете продавать?»\n- Самопрезентация: внешний вид, экспертность, понимание, зачем встречаемся и какой следующий шаг.\n- Простые нормы: спроси про бахилы и нужно ли разуваться.\n- Стажёру первое время лучше ездить на все встречи, наблюдать и учиться. Опытному агенту — только на те, что стоят времени.\n\n## Ход встречи\n1. **80% времени про человека.** «Расскажите мне про квартиру, как покупателю. Почему вы выбрали именно её? Почему эта планировка?»\n2. **Комплименты только искренние.** Плохой ремонт не хвали.\n3. **Копай мотивацию.** Почему продаёте, а не сдаёте? Что покупаете взамен? Почему решили продавать сами? Кто будет на сделке?\n4. **Через 5–15 минут — переход.** «Я понял ваши цели и понимаю, кому можно предложить квартиру. Для этого нам нужны три простые договорённости». Дальше показы (ключи), презентация, комиссия.\n5. **Фото и связь.** Как и где продвигаем, как часто держу в курсе: минимум раз в неделю и после каждого показа.\n\nВопросы на встрече (Димитриадис): «Вы действительно должны продать квартиру? Хотите, чтобы продажей занимался я? Если по вашей цене я пойму, что не продам, скажу „нет“ сразу, а не через два месяца буду объяснять почему».\n\n## Правила дожима\n- Лучше пережать, чем не дожать. После первого «нет» ищи компромисс, например рекламу в тестовом режиме на время.\n- Главное — устное согласие на рекламу и фото. Агентский договор на первой встрече не обязателен (см. расхождение в [Три договорённости](#tri-dogovorennosti)).\n- Комиссию держи максимально. Ниже 3% — «согласую с руко
